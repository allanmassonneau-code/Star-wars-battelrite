<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arène Ninja</title>
<style>
/* Plein écran : une arène canvas 16:9 centrée, look unique sombre */
:root{--bg:#04050b;--fg:#dfe8ff;color-scheme:dark}
#net,#opt{background:#1c120a!important;border-color:#6a4426!important}#net h2,#opt h2{color:#ffb347!important}#net button,#optB{background:#ff9a3a}#backB{background:#1c120acc!important;border-color:#6a4426!important;color:#f3d9b0!important}#optB{color:#1a1008!important;background:#ffb347!important;border-color:#8a5a2a!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;cursor:none;background:var(--bg)}
#net{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));box-sizing:border-box;background:#0d1424;border:1px solid #3a4a6a;border-radius:12px;padding:20px;z-index:5;color:var(--fg)}
#net h2{margin:0 0 6px;color:#ffe81f;font-size:20px}#net p{margin:8px 0;color:#9fb3d9;font-size:14px;line-height:1.4}
#net button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:9px 14px;background:#ffe81f;color:#10131c;cursor:pointer}
#net button.alt{background:#2a3a5a;color:#dfe8ff}#net button:focus-visible,#net input:focus-visible{outline:2px solid #7df;outline-offset:2px}
#net .row{display:flex;gap:8px;margin-top:10px}#net input{flex:1;min-width:0;font:inherit;font-size:18px;letter-spacing:.2em;text-transform:uppercase;padding:8px;border-radius:8px;border:1px solid #3a4a6a;background:#04050b;color:#fff}
#nStat{color:#ffe81f!important;min-height:1.4em}
#backB{position:fixed;left:12px;top:12px;z-index:4;font:inherit;font-size:13px;font-weight:bold;text-decoration:none;border:1px solid #3a4a6a;border-radius:8px;padding:6px 10px;background:#0d1424cc;color:#dfe8ff}#backB:hover{border-color:#ffe81f}#backB:focus-visible{outline:2px solid #7df;outline-offset:2px}
#optB{position:fixed;right:12px;bottom:12px;z-index:4;font:inherit;font-size:14px;font-weight:bold;border:1px solid #3a4a6a;border-radius:8px;padding:6px 10px;background:#0d1424cc;color:#dfe8ff;cursor:pointer}
#opt{position:fixed;right:12px;bottom:52px;width:min(300px,calc(100vw - 32px));box-sizing:border-box;background:#0d1424;border:1px solid #3a4a6a;border-radius:12px;padding:16px;z-index:6;color:var(--fg);cursor:auto}
#opt h2{margin:0 0 10px;color:#ffe81f;font-size:17px}#opt label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;font-size:14px;color:#c9d6f2}
#opt input[type=range]{flex:1;max-width:140px;accent-color:#ffe81f}#opt input[type=checkbox]{accent-color:#ffe81f;width:16px;height:16px}#opt output{width:34px;text-align:right;color:#ffe81f;font-variant-numeric:tabular-nums}
#opt select{font:inherit;font-size:13px;background:#04050b;color:#fff;border:1px solid #3a4a6a;border-radius:6px;padding:3px 4px;max-width:150px}#opt select:disabled,#opt input:disabled{opacity:.5}#opt .note{margin:0 0 4px;font-size:12px;color:#9fb3d9}#opt{max-height:calc(100vh - 70px);overflow:auto}
#opt button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:7px 12px;background:#2a3a5a;color:#dfe8ff;cursor:pointer;margin-top:6px}#optB:focus-visible,#opt :focus-visible{outline:2px solid #7df;outline-offset:2px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<a id="backB" href="../index.html">⇦ Changer de jeu</a>
<button id="optB" aria-expanded="false" aria-controls="opt">⚙ Partie & options (O)</button>
<div id="opt" hidden>
 <h2>Partie</h2>
 <p id="cfgNote" class="note"></p>
 <label>Arène / duel : taille des équipes <select id="cTeam"><option value="1">1 contre 1</option><option value="2">2 contre 2</option><option value="3">3 contre 3</option></select></label>
 <label>Carte <select id="cMap"><option value="0">Terrain d'entraînement</option><option value="1">Vallée de la Fin</option><option value="2">Désert de Suna</option></select></label>
 <label>Manches gagnantes <select id="cWins"><option value="1">1 (manche unique)</option><option value="2">2 (meilleur des 3)</option><option value="3">3 (meilleur des 5)</option><option value="4">4 (meilleur des 7)</option></select></label>
 <label>Bataille : joueurs par camp <select id="cBsize"><option>5</option><option>10</option><option>15</option><option>20</option></select></label>
 <label>Bataille : renforts par camp <select id="cTickets"><option>20</option><option>40</option><option>60</option><option>100</option><option>150</option></select></label>
 <label>Mort subite (arène) <input type="checkbox" id="cSd"></label>
 <label>Pilule du soldat (arène) <input type="checkbox" id="cOrb"></label>
 <label>Soins au sol (bataille) <input type="checkbox" id="cPk"></label>
 <h2 style="margin-top:14px">Options audio</h2>
 <label>Volume général <input type="range" id="oMaster" min="0" max="100"><output id="vMaster"></output></label>
 <label>Bruitages <input type="range" id="oFx" min="0" max="100"><output id="vFx"></output></label>
 <label>Répliques <input type="range" id="oVoice" min="0" max="100"><output id="vVoice"></output></label>
 <label>Répliques à l'ultime <input type="checkbox" id="oVoiceOn"></label>
 <label>Cri Wilhelm (rare) <input type="checkbox" id="oWil"></label>
 <label>Son spatialisé (gauche/droite) <input type="checkbox" id="oSpat"></label>
 <label>Couper le son (M) <input type="checkbox" id="oMute"></label>
 <button id="oClose">Fermer</button>
</div>
<div id="net" hidden>
 <h2>Coop en ligne</h2>
 <p>Jusqu'à 8 ninjas. L'hôte choisit le mode et règle la partie (⚙), ses amis rejoignent avec le code du salon. En duel et en bataille, chacun choisit son équipe.</p>
 <button id="nHost">Héberger une partie</button>
 <div class="row"><input id="nCode" maxlength="4" placeholder="CODE" aria-label="Code du salon"><button id="nJoin">Rejoindre</button></div>
 <p id="nStat"></p>
 <button id="nClose" class="alt">Fermer</button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1280,H=720;
// rendu à la résolution réelle de l'écran (sinon le canvas 1280x720 est étiré et flou)
let RS=1;function fit(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.round(r.width*d)),h=Math.max(1,Math.round(r.height*d));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}RS=cv.width/W}
addEventListener('resize',fit);fit();
const A={x:90,y:70,w:1100,h:555},CX=A.x+A.w/2,CY=A.y+A.h/2;
const MAP={x:0,y:0,w:4200,h:2000};
const ARENA_OBST=[{x:430,y:235,r:34},{x:850,y:235,r:34},{x:430,y:460,r:34},{x:850,y:460,r:34}];
const stars=Array.from({length:180},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.2}));
const keys={},mouse={x:CX,y:CY,l:0};let pressed={};
const SLOTS=['lmb','rmb','Space','KeyQ','KeyE','KeyR'];
const lbl={lmb:'Clic G',rmb:'Clic D',Space:'Espace',KeyQ:'Q',KeyE:'E',KeyR:'R',KeyW:'W',KeyA:'A',KeyS:'S',KeyD:'D',KeyM:'M',KeyF:'F'};
try{navigator.keyboard&&navigator.keyboard.getLayoutMap().then(m=>{for(const c of['KeyQ','KeyE','KeyR','KeyW','KeyA','KeyS','KeyD','KeyM','KeyF'])if(m.get(c))lbl[c]=m.get(c).toUpperCase()}).catch(()=>{})}catch(e){}
const wake=()=>{const a=ac();if(a&&a.state==='suspended')a.resume()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;wake();if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;if(e.code==='Space'||e.code==='Tab'||e.code.startsWith('Arrow'))e.preventDefault();if(e.code==='KeyM'){muted=!muted;syncOpt()}if(e.code==='KeyO')toggleOpt()});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;mouse.l=0});
cv.addEventListener('mousemove',e=>{const b=cv.getBoundingClientRect();mouse.x=(e.clientX-b.left)*W/b.width;mouse.y=(e.clientY-b.top)*H/b.height});
cv.addEventListener('mousedown',e=>{wake();if(e.button===0){mouse.l=1;pressed.lmb=1}if(e.button===2)pressed.rmb=1});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=0});
cv.addEventListener('contextmenu',e=>e.preventDefault());

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random,lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d)};
function rgba(h,a){if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// ---------- Son : bruitages synthétisés (kunai, chakra, explosions) ----------
let AC=null,NB=null,MB=null,FXB=null,DK=null,VB=null,RV=null,muted=false,POS=null;
// options audio (gardées dans le navigateur)
const OPT={master:60,fx:80,voice:80,voiceOn:true,wil:true,spat:true};
try{Object.assign(OPT,JSON.parse(localStorage.getItem('nrOpt')||'{}'))}catch(e){}
function applyOpt(){try{localStorage.setItem('nrOpt',JSON.stringify(OPT))}catch(e){}if(!AC)return;const t=AC.currentTime;MB.gain.setTargetAtTime(.75*OPT.master/100,t,.03);FXB.gain.setTargetAtTime(OPT.fx/80,t,.03);VB.gain.setTargetAtTime(1.2*OPT.voice/80,t,.03)}
// moteur audio : bus bruitages (adouci, baissé pendant les répliques) + bus voix -> compresseur doux -> sortie ; réverbération commune pour fondre le tout
function ac(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-24;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.25;
 MB=AC.createGain();MB.gain.value=.45;MB.connect(comp);comp.connect(AC.destination);
 const lp=AC.createBiquadFilter();lp.type='highshelf';lp.frequency.value=5500;lp.gain.value=-6;FXB=AC.createGain();DK=AC.createGain();FXB.connect(DK);DK.connect(lp);lp.connect(MB);VB=AC.createGain();VB.connect(MB);
 RV=AC.createConvolver();const len=Math.floor(AC.sampleRate*1.4),ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}RV.buffer=ir;const rg=AC.createGain();rg.gain.value=.3;RV.connect(rg);rg.connect(MB);applyOpt();loadSnd()}catch(e){AC=0}}return AC}
const live=()=>{const a=ac();return a&&!muted&&a.state==='running'?a:null};
// spatialisation : volume selon la distance à la caméra + panoramique gauche/droite ; les sons lointains sont plus étouffés et plus réverbérés
function out(n,rev,bus){const a=AC;let d=n;if(POS&&a.createStereoPanner){const pn=a.createStereoPanner(),g=a.createGain();pn.pan.value=OPT.spat?POS.pan:0;g.gain.value=POS.vol;d.connect(g);g.connect(pn);d=pn;
  if(POS.far>.05){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=12000-POS.far*9000;d.connect(f);d=f}}
 d.connect(bus||FXB);const w=a.createGain();w.gain.value=rev?1:.35;if(POS)w.gain.value*=1+POS.far*1.5;d.connect(w);w.connect(RV)}
function at(x,y,f){if(x==null){f();return}const dx=x-cam.x,dy=(y-cam.y)*1.4,dd=Math.hypot(dx,dy),far=Math.min(1,dd/900);POS={pan:Math.max(-.75,Math.min(.75,dx/700)),vol:1-far*.65,far};try{f()}finally{POS=null}}
function env(a,t,v,att,dur){const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);return g}
function osc(type,f0,f1,dur,vol,o={}){const a=live();if(!a)return;const t=a.currentTime+(o.delay||0),os=a.createOscillator(),g=env(a,t,vol,o.att||.005,dur);os.type=type;os.frequency.setValueAtTime(f0,t);os.frequency.exponentialRampToValueAtTime(f1,t+(o.sweep||dur));if(o.detune)os.detune.value=o.detune;
 let n=os;if(o.lp){const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(o.lp2,t+dur);n.connect(f);n=f}
 if(o.bp){const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=o.bp;f.Q.value=o.q||4;n.connect(f);n=f}n.connect(g);out(g,o.rev);os.start(t);os.stop(t+dur+.05)}
function nz(dur,vol,o={}){const a=live();if(!a)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=a.currentTime+(o.delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=env(a,t,vol,o.att||.005,dur);s.buffer=NB;s.loop=true;f.type=o.type||'lowpass';f.frequency.setValueAtTime(o.f0||1000,t);if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);f.Q.value=o.q||1;s.connect(f);
 let n=f;if(o.crackle){const cg=a.createGain();for(let k=0;k<dur*45;k++)cg.gain.setValueAtTime(Math.random()<.45?0:1,t+k/45);f.connect(cg);n=cg}n.connect(g);out(g,o.rev);s.start(t,Math.random());s.stop(t+dur+.05)}
const tone=(type,f0,f1,dur,vol)=>osc(type,f0,f1,dur,vol*1.4,{rev:1});
const SYN={
 saber:()=>{nz(.22,.09,{type:'bandpass',f0:500,f1:2600,q:1.1});osc('triangle',900,500,.12,.02,{delay:.05})},
 ignite:()=>{osc('sine',196,190,1.4,.12,{rev:1});osc('sine',392,380,1.1,.05,{rev:1});osc('triangle',587,560,.9,.03,{rev:1})},
 blaster:()=>{nz(.13,.07,{type:'highpass',f0:2600,f1:5200});osc('sine',3200,2600,.18,.02,{delay:.03,rev:1})},
 heavy:()=>{osc('square',900,55,.4,.045,{lp:2200,lp2:180,rev:1});nz(.35,.08,{type:'bandpass',f0:250,f1:1600,q:.8})},
 hit:()=>{osc('sine',150,45,.15,.12);nz(.08,.06,{type:'bandpass',f0:1600,f1:500,q:1})},
 boom:()=>{osc('sine',85,26,.8,.28);nz(1,.32,{type:'lowpass',f0:1400,f1:50,rev:1});nz(.15,.12,{type:'highpass',f0:2500,f1:800})},
 zap:()=>{nz(.45,.11,{type:'bandpass',f0:3800,f1:1700,q:2,crackle:1,rev:1});osc('sawtooth',62,55,.45,.03,{lp:400})},
 zapS:()=>nz(.12,.045,{type:'bandpass',f0:4200,f1:2600,q:2,crackle:1}),
 dash:()=>nz(.3,.09,{type:'bandpass',f0:280,f1:2000,q:.8}),
 orb:()=>{osc('sine',660,1320,.45,.06,{rev:1});osc('sine',990,1980,.45,.04,{delay:.08,rev:1})},
  deflect:()=>{osc('triangle',3400,3000,.25,.04,{rev:1});osc('square',2600,1700,.13,.02,{bp:2600,q:6,rev:1});nz(.16,.08,{type:'highpass',f0:3200,f1:1800});osc('sawtooth',190,120,.22,.04,{lp:900})},
 win:()=>{[392,523,659,784].forEach((f,i)=>osc('triangle',f,f,.9,.06,{delay:i*.12,att:.02,rev:1}))},
 lose:()=>{osc('sawtooth',196,98,1,.05,{lp:900,lp2:300,rev:1});osc('sawtooth',185,92,1,.04,{lp:800,lp2:250,delay:.15})},
 flame:()=>nz(.2,.05,{type:'lowpass',f0:1000,f1:450}),
 fire:()=>{nz(.5,.11,{type:'lowpass',f0:1800,f1:300,rev:1});osc('sawtooth',90,50,.4,.04,{lp:500})},
 water:()=>{nz(.35,.09,{type:'bandpass',f0:1400,f1:400,q:1.5,rev:1});for(let i=0;i<3;i++)osc('sine',600+i*220,1200+i*300,.08,.03,{delay:.05+i*.06})},
 wind:()=>nz(.55,.09,{type:'bandpass',f0:600,f1:2400,q:5,rev:1}),
 chidori:()=>{nz(.45,.07,{type:'highpass',f0:4000,f1:6000,crackle:1});for(let i=0;i<5;i++)osc('square',2400+rnd()*900,3200,.05,.015,{delay:i*.07})},
 rock:()=>{osc('sine',90,40,.35,.16);nz(.3,.12,{type:'lowpass',f0:600,f1:120,rev:1})},
 sand:()=>nz(.5,.06,{type:'highpass',f0:2500,f1:1500,crackle:1}),
 poof:()=>{nz(.25,.1,{type:'bandpass',f0:900,f1:300,q:.8,rev:1});osc('sine',300,120,.12,.06)},
 bugs:()=>{osc('sawtooth',140,150,.5,.03,{lp:900});osc('sawtooth',147,141,.5,.025,{lp:900,detune:30})},
 bone:()=>{nz(.08,.12,{type:'highpass',f0:3000});osc('square',700,300,.07,.03)},
 roar:()=>{osc('sawtooth',110,70,.7,.06,{lp:700,rev:1});nz(.6,.08,{type:'lowpass',f0:900,f1:200})},
 genjutsu:()=>{osc('sine',880,440,.6,.04,{rev:1});osc('sine',1320,660,.6,.025,{rev:1,delay:.05})},
 jyuken:()=>{nz(.2,.08,{type:'bandpass',f0:1800,f1:900,q:2});osc('sine',520,260,.15,.05)},
 shadow:()=>{osc('sine',160,80,.5,.05,{rev:1});nz(.4,.04,{type:'lowpass',f0:400,f1:150})},
 ex:()=>{osc('triangle',523,1046,.22,.05,{rev:1});osc('triangle',784,1568,.22,.04,{delay:.06,rev:1})}};
// fichiers : nom -> nombre de variantes (sounds/nomN.mp3, ou sounds/nom.mp3 si une seule)
const SND_N={};
const VOICES=[];
const SND_VOL={saber:.26,saberS:.26,ignite:.32,blaster:.17,blasterE:.17,bow:.22,han:.2,heavy:.24,hit:.22,boom:.36,zap:.24,zapS:.12,dash:.16,deflect:.28,flame:.14,wilhelm:.35};
const PLAYING={};const MAXV=3; // au plus 3 exemplaires d'un même son en même temps (évite l'empilement en 20c20)
const BUF={};let sndLoad=false,voiceEnd=0;
function loadSnd(){if(sndLoad||!AC)return;sndLoad=true;const L=Object.entries(SND_N).flatMap(([k,n])=>n>1?[...Array(n)].map((_,i)=>[k,k+i]):[[k,k]]).concat(VOICES.map(c=>['v_'+c,'v_'+c]));
 for(const [k,f] of L)fetch('sounds/'+f+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,ko)=>AC.decodeAudioData(b,ok,ko))).then(b=>(BUF[k]=BUF[k]||[]).push(b)).catch(()=>{})}
function playBuf(k,vol,rate,bus){const a=live(),L=BUF[k];if(!a||!L||!L.length)return false;if((PLAYING[k]||0)>=MAXV)return -1;const s=a.createBufferSource(),g=a.createGain();s.buffer=L[Math.random()*L.length|0];s.playbackRate.value=rate||(.93+Math.random()*.14);
 const n=PLAYING[k]||0;g.gain.value=vol/(1+n*.5);PLAYING[k]=n+1;s.onended=()=>PLAYING[k]--;s.connect(g);out(g,k!=='hit',bus);s.start();return s.buffer.duration/s.playbackRate.value}
const SFX={};
for(const k in SYN)SFX[k]=()=>{if(!playBuf(k,SND_VOL[k]||.4))SYN[k]()};
for(const [k,b] of [['saberS','saber'],['blasterE','blaster'],['bow','blaster'],['han','blaster']])SFX[k]=()=>{if(!playBuf(k,SND_VOL[k]))SYN[b]()};
SFX.wilhelm=()=>OPT.wil&&playBuf('wilhelm',SND_VOL.wilhelm,1);
// répliques cultes à l'ultime (une seule voix à la fois)
for(const c of VOICES)SFX['v_'+c]=()=>{const a=live();if(!a||!OPT.voiceOn||a.currentTime<voiceEnd)return;const d=playBuf('v_'+c,.7,1,VB);if(d>0){voiceEnd=a.currentTime+d;const t=a.currentTime;DK.gain.cancelScheduledValues(t);DK.gain.setTargetAtTime(.55,t,.05);DK.gain.setTargetAtTime(1,t+d,.3)}}; // les bruitages s'effacent sous la réplique
// variante selon le perso : sabre Sith, blasters impériaux rouges, arbalète de Chewie, DL-44 de Han
const sndKey=(n,u)=>{const m=VFX&&VSND[VFX];return!m||VSKIP[n]?n:(m[n]||m['*']||n)};
// les sons et effets lointains sont coupés (utile en bataille 20c20)
let cam={x:CX,y:CY},Yc=377.5;
const nearMe=(x,y)=>Math.abs(x-cam.x)<820&&Math.abs(y-cam.y)<560;

 if(first&&mode==='battle')cam={x:player.x,y:player.y};
}
function guestFrame(dt){for(const k in pressed)net.gp[k]=1;
 const k=Math.min(1,dt*14);for(const u of units)if(u!==player){u.x+=(u.nx-u.x)*k;u.y+=(u.ny-u.y)*k}
 // prédiction : le coéquipier voit son personnage bouger tout de suite, sans attendre l'hôte

  const can=u.stun<=0&&!u.dash&&!(u.root>0),sp=can?u.ch.spd*(u.slow>0?.55:1)*(u.haste>0?1.4:1)*(u.cast?.4:1)*(u.flame?.5:1)*(u.spin?.8:1)*(I.f&&canBlock(u)&&u.stam>0?.55:1)*(u.ch.pass==='speed'?1.1:1):0;
  const vx=mx*sp,vy=my*sp;u.x+=vx*dt;u.y+=vy*dt;collide(u);u.moving=l>.1&&sp>0;if(u.moving)u.walk+=dt*13;
  net.seq++;net.pend.push({seq:net.seq,vx,vy,dt});if(net.pend.length>180)net.pend.shift()}
 for(const p of projs){p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot=(p.rot||0)+dt*25;if(p.life0)p.life=Math.max(.001,p.life-dt)}
 for(const z of zones)z.t=Math.max(0,z.t-dt);
 ageFx(dt);shake=Math.max(0,shake-dt);
 if(mode==='battle'&&player){const c=Math.min(1,dt*6);cam.x+=(clamp(player.x,420,MAP.w-420)-cam.x)*c;cam.y+=(clamp(player.y,240,MAP.h-170)-cam.y)*c}}
function netTick(dt){if(!coop())return;net.sendT-=dt;if(net.sendT>0)return;
 if(net.role==='host'){net.sendT=state==='menu'?.5:mode==='battle'?.05:.033;const base=makeSnap();
  for(const P of livePeers()){const i=units.findIndex(u=>u.ctrl==='remote'&&u.rid===P.id);try{P.conn.send(state==='menu'?base:Object.assign({},base,{you:i,mc:i>=0?units[i].cds:null,ack:P.in?P.in.seq||0:0}))}catch(e){}}
  net.ev={fx:[],txt:[],snd:[],sp:[],ci:[]}}
 else if(net.live){net.sendT=0;const I=localInput();netSend({t:'in',seq:net.seq,mx:I.mx,my:I.my,ax:rd(I.ax),ay:rd(I.ay),l:!!mouse.l,p:Object.keys(net.gp),sh:!!I.sh,f:!!I.f,cx:rd(cam.x),cy:rd(cam.y)});net.gp={}}}

 if(isGuest()&&net.live)guestFrame(dt);else{const udt=hs>0?0:dt;hs=Math.max(0,hs-dt);update(udt)}
