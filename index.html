<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arène Holonet</title>
<style>
/* Plein écran : une arène canvas 16:9 centrée, look unique sombre */
:root{--bg:#04050b;--fg:#dfe8ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;cursor:none;background:var(--bg)}
#net{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));box-sizing:border-box;background:#0d1424;border:1px solid #3a4a6a;border-radius:12px;padding:20px;z-index:5;color:var(--fg)}
#net h2{margin:0 0 6px;color:#ffe81f;font-size:20px}#net p{margin:8px 0;color:#9fb3d9;font-size:14px;line-height:1.4}
#net button{font:inherit;font-weight:bold;border:0;border-radius:8px;padding:9px 14px;background:#ffe81f;color:#10131c;cursor:pointer}
#net button.alt{background:#2a3a5a;color:#dfe8ff}#net button:focus-visible,#net input:focus-visible{outline:2px solid #7df;outline-offset:2px}
#net .row{display:flex;gap:8px;margin-top:10px}#net input{flex:1;min-width:0;font:inherit;font-size:18px;letter-spacing:.2em;text-transform:uppercase;padding:8px;border-radius:8px;border:1px solid #3a4a6a;background:#04050b;color:#fff}
#nStat{color:#ffe81f!important;min-height:1.4em}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<div id="net" hidden>
 <h2>Coop en ligne</h2>
 <p>Jouez à deux dans la même équipe. L'hôte choisit le mode et lance la partie, le coéquipier rejoint avec le code du salon.</p>
 <button id="nHost">Héberger une partie</button>
 <div class="row"><input id="nCode" maxlength="4" placeholder="CODE" aria-label="Code du salon"><button id="nJoin">Rejoindre</button></div>
 <p id="nStat"></p>
 <button id="nClose" class="alt">Fermer</button>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

 const u=player;if(u&&!u.dead&&state==='fight'){const I=localInput();u.aim=Math.atan2(I.ay-u.y,I.ax-u.x);let mx=I.mx,my=I.my;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
  const can=u.stun<=0&&!u.dash&&!(u.root>0),sp=can?u.ch.spd*(u.slow>0?.55:1)*(u.haste>0?1.4:1)*(u.cast?.4:1)*(u.flame?.5:1)*(u.spin?.8:1)*(I.f&&canBlock(u)&&u.stam>0?.55:1)*(u.ch.pass==='speed'?1.1:1):0;
  const vx=mx*sp,vy=my*sp;u.x+=vx*dt;u.y+=vy*dt;collide(u);u.moving=l>.1&&sp>0;if(u.moving)u.walk+=dt*13;
  net.seq++;net.pend.push({seq:net.seq,vx,vy,dt});if(net.pend.length>180)net.pend.shift()}

 for(const z of zones)z.t=Math.max(0,z.t-dt);

 if(mode==='battle'&&player){const c=Math.min(1,dt*6);cam.x+=(clamp(player.x,420,MAP.w-420)-cam.x)*c;cam.y+=(clamp(player.y,240,MAP.h-170)-cam.y)*c}}
function netTick(dt){if(!coop())return;net.sendT-=dt;if(net.sendT>0)return;
 if(net.role==='host'){net.sendT=state==='menu'?.5:mode==='battle'?.05:.033;netSend(makeSnap());net.ev={fx:[],txt:[],snd:[],sp:[]}}
 else if(net.live){net.sendT=0;const I=localInput();netSend({t:'in',seq:net.seq,mx:I.mx,my:I.my,ax:rd(I.ax),ay:rd(I.ay),l:!!mouse.l,p:Object.keys(net.gp),sh:!!I.sh,f:!!I.f,cx:rd(cam.x),cy:rd(cam.y)});net.gp={}}}

 if(isGuest()&&net.live)guestFrame(dt);else{const udt=hs>0?0:dt;hs=Math.max(0,hs-dt);update(udt)}
