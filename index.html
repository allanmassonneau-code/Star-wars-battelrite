<!doctype html>
<html lang="fr">
<head>

<title>Arène Holonet</title>
<style>
/* Plein écran : une arène canvas 16:9 centrée, look unique sombre */
:root{--bg:#04050b;--fg:#dfe8ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;cursor:none;background:var(--bg)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1280,H=720;
const A={x:90,y:70,w:1100,h:555},CX=A.x+A.w/2,CY=A.y+A.h/2;
const pillars=[{x:430,y:235,r:34},{x:850,y:235,r:34},{x:430,y:460,r:34},{x:850,y:460,r:34}];
const stars=Array.from({length:180},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.2}));
const keys={},mouse={x:CX,y:CY,l:0};let pressed={};
const SLOTS=['lmb','rmb','Space','KeyQ','KeyE','KeyR'];
const lbl={lmb:'Clic G',rmb:'Clic D',Space:'Espace',KeyQ:'Q',KeyE:'E',KeyR:'R',KeyW:'W',KeyA:'A',KeyS:'S',KeyD:'D',KeyM:'M'};
try{navigator.keyboard&&navigator.keyboard.getLayoutMap().then(m=>{for(const c of['KeyQ','KeyE','KeyR','KeyW','KeyA','KeyS','KeyD','KeyM'])if(m.get(c))lbl[c]=m.get(c).toUpperCase()}).catch(()=>{})}catch(e){}
const wake=()=>{const a=ac();if(a&&a.state==='suspended')a.resume()};
addEventListener('keydown',e=>{wake();if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(e.code==='KeyM')muted=!muted});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;mouse.l=0});
cv.addEventListener('mousemove',e=>{const b=cv.getBoundingClientRect();mouse.x=(e.clientX-b.left)*W/b.width;mouse.y=(e.clientY-b.top)*H/b.height});
cv.addEventListener('mousedown',e=>{wake();if(e.button===0){mouse.l=1;pressed.lmb=1}if(e.button===2)pressed.rmb=1});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=0});
cv.addEventListener('contextmenu',e=>e.preventDefault());

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random,lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d)};
function rgba(h,a){if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// ---------- Son (synthétisé, aucun fichier) ----------
let AC=null,NB=null,muted=false;
function ac(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=0}}return AC}
function tone(type,f0,f1,dur,vol){const a=ac();if(!a||muted||a.state!=='running')return;const t=a.currentTime,o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+dur)}
function noise(dur,vol,freq){const a=ac();if(!a||muted||a.state!=='running')return;if(!NB){NB=a.createBuffer(1,a.sampleRate,a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 const t=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();s.buffer=NB;f.type='lowpass';f.frequency.value=freq;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(v);v.connect(a.destination);s.start(t);s.stop(t+dur)}
const SFX={saber:()=>tone('sawtooth',220,80,.2,.05),blaster:()=>tone('square',1100,180,.13,.025),heavy:()=>tone('sawtooth',700,90,.3,.06),hit:()=>tone('triangle',220,50,.12,.09),
 boom:()=>noise(.6,.3,500),zap:()=>noise(.35,.12,4000),dash:()=>tone('sine',250,800,.22,.06),orb:()=>tone('sine',520,1040,.35,.07),deflect:()=>tone('square',1400,2200,.08,.04),win:()=>tone('triangle',440,880,.6,.08),lose:()=>tone('triangle',300,90,.7,.08),flame:()=>noise(.15,.05,1200)};

 grievous:{name:'Général Grievous',side:1,desc:'Quatre sabres, tourbillon',hp:185,spd:215,pref:55,
  look:{scale:1.08,legs:'#ddd8c8',boot:'#888',torso:'#e8e2d0',cape:'#3a2a20',arm:'#ddd8c8',bony:1,head:{t:'grievous'},weapon:{t:'saber',col:'#3af',two:'#3f3'}},
  abil:[AB.saber({arc:2.2,dmg:11,cd:.45,range:85}),AB.rush({n:'Estocade',d:200,dmg:14}),AB.rush({n:'Ruée des griffes',d:260,dmg:6,kb:400,cd:7}),AB.spin({dur:.9,dmg:6}),AB.deflect({n:'Avancée implacable',dur:1.6,haste:1,cd:10}),AB.spin({n:'Ouragan de sabres',ult:1,dur:1.8,dmg:8,r:120})]},
};
const HEROES=Object.keys(CH);
const saberCol=u=>u.ch.look.weapon.col||'#ccc';

// ---------- État ----------
let state='menu',units=[],projs=[],fx=[],txt=[],zones=[],orb=null,orbUsed=false,score=[0,0],round=1,timer=0,stateT=0,playerChamp='luke',aiChamp='vader',winner=0,shake=0,hs=0,flashS=0,banner=null,hover='luke';
const SD_START=45,SD_LEN=35;
const sdR=()=>timer<SD_START?9999:lerp(720,130,clamp((timer-SD_START)/SD_LEN,0,1));
function mkUnit(c,x,y,team){const ch=CH[c];return{c,ch,x,y,z:0,vx:0,vy:0,kx:0,ky:0,r:18*(ch.look.scale>1?1.1:1),hp:ch.hp,max:ch.hp,energy:0,team,cds:[0,0,0,0,0,0],stun:0,slow:0,haste:0,rage:0,rapid:0,unstop:0,deflect:0,shield:0,shieldT:0,dash:null,cast:null,spin:null,flame:null,aim:team?Math.PI:0,swing:0,swingA:0,saberOut:0,walk:0,moving:0,aiT:.5,strT:0,strDir:1,flash:0,dead:false,deadT:0}}
function startMatch(c){playerChamp=c;const o=HEROES.filter(x=>CH[x].side!==CH[c].side);aiChamp=o[Math.floor(rnd()*o.length)];score=[0,0];round=1;startRound()}
function startRound(){units=[mkUnit(playerChamp,A.x+150,CY,0),mkUnit(aiChamp,A.x+A.w-150,CY,1)];projs=[];fx=[];txt=[];zones=[];orb=null;orbUsed=false;timer=0;banner=null;state='countdown';stateT=3}
const foe=u=>units[1-u.team];

// ---------- Mécaniques ----------
function use(u,i,td,aimOv){const ab=u.ch.abil[i];if(u.cds[i]>0||u.stun>0||u.dash||u.cast||u.spin||u.flame)return false;if(ab.ult&&u.energy<100)return false;if((ab.throw||ab.melee)&&u.saberOut>0)return false;
 u.cds[i]=(ab.cd||1)*(i===0&&u.rapid>0?.45:1);if(ab.ult){u.energy-=100;flashS=.25;shake=.3}
 if(ab.cast){u.cast={i,t:0,dur:ab.cast,td:td??200,aimOv};return true}
 ab.f(u,aimOv??u.aim,td??200);return true}
function proj(u,a,o){projs.push(Object.assign({x:u.x+Math.cos(a)*24,y:u.y+Math.sin(a)*24,vx:Math.cos(a)*o.spd,vy:Math.sin(a)*o.spd,owner:u,src:u,rot:0,life0:o.life},o))}
function melee(u,a,range,arc,dmg){u.swing=.18;u.swingA=a;SFX.saber();fx.push({x:u.x,y:u.y,swing:1,a,range,arc,t:.18,m:.18,col:saberCol(u)});const e=foe(u);
 if(!e.dead&&dist(u,e)<range+e.r&&angDiff(ang(u,e),a)<arc/2&&hit(e,u,dmg,{melee:1}))hs=.05;
 for(const p of projs)if(p.owner.team!==u.team&&Math.hypot(p.x-u.x,p.y-u.y)<range&&angDiff(Math.atan2(p.y-u.y,p.x-u.x),a)<arc/2&&rnd()<.5)reflect(p,u)}
function cone(u,a,range,arc,dmg,o,col){const e=foe(u);for(let i=0;i<24;i++){const b=a+(rnd()-.5)*arc,s=300+rnd()*300;fx.push({x:u.x,y:u.y,vx:Math.cos(b)*s,vy:Math.sin(b)*s,t:.4,m:.4,col,r:3})}
 if(!e.dead&&dist(u,e)<range+e.r&&angDiff(ang(u,e),a)<arc/2)hit(e,u,dmg,Object.assign({melee:1},o))}
function lightning(u,a,o){const e=foe(u);fx.push({bolt:1,u,a,range:o.range,n:o.small?2:4,t:o.small?.15:.3,m:o.small?.15:.3,col:'#b8f'});if(!o.small)fx.push({light:1,x:u.x+Math.cos(a)*100,y:u.y+Math.sin(a)*100,r:180,t:.3,m:.3,col:'#b8f'});
 if(!e.dead&&dist(u,e)<o.range+e.r&&angDiff(ang(u,e),a)<o.arc/2&&hit(e,u,o.dmg,{slow:o.slow,melee:1})&&o.heal){u.hp=Math.min(u.max,u.hp+o.heal);say(u,'+'+o.heal,'#6f9')}}
function aoe(u,x,y,r,dmg,o={},col){const e=foe(u);col=col||(o.stun?'#b8f':'#fc6');ring(x,y,r,col);if(!o.quiet)fx.push({light:1,x,y,r:r*1.6,t:.35,m:.35,col});
 if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r&&hit(e,u,dmg,Object.assign({fx:x,fy:y},o)))hs=Math.max(hs,dmg>20?.1:.03)}
function dash(u,a,d,dur,o={}){const tx=clamp(u.x+Math.cos(a)*d,A.x+u.r,A.x+A.w-u.r),ty=clamp(u.y+Math.sin(a)*d,A.y+u.r,A.y+A.h-u.r);u.dash={sx:u.x,sy:u.y,tx,ty,t:0,dur,jump:o.jump||0,end:o.end,dmg:o.dmg,kb:o.kb,hitDone:false}}
function reflect(p,t){p.owner=t;p.vx*=-1.1;p.vy*=-1.1;p.life=Math.max(p.life,.7);say(t,'RENVOI !','#7df');sparks(p.x,p.y,'#7df',8);SFX.deflect()}
function hit(t,src,dmg,o={}){
 if(t.dead||state!=='fight')return false;
 if(src&&t.deflect>0&&o.melee){src.stun=Math.max(src.stun,.9);src.cast=null;src.spin=null;t.deflect=0;say(t,'RENVOI !','#7df');say(src,'ÉTOURDI','#b8f');sparks(t.x,t.y,'#7df',14);SFX.deflect();return false}
 if(src&&src.rage>0)dmg*=1.35;
 let d=dmg;if(t.shield>0){const ab=Math.min(t.shield,d);t.shield-=ab;d-=ab}
 t.hp-=d;
 if(!o.silent){t.flash=.12;if(src)src.energy=Math.min(100,src.energy+dmg*.7);t.energy=Math.min(100,t.energy+dmg*.25);
  if(dmg>0)say(t,'-'+Math.round(d),d<dmg?'#fc6':'#fff');sparks(t.x,t.y,t.team?'#f66':'#6cf',6);shake=Math.max(shake,.08);SFX.hit()}
 const hard=t.unstop<=0;
 if(o.stun&&hard){t.stun=Math.max(t.stun,o.stun);say(t,'ÉTOURDI','#b8f')}
 if((o.stun||o.kb)&&hard&&(t.cast||t.spin||t.flame)){t.cast=null;t.spin=null;t.flame=null;say(t,'INTERROMPU','#fc6')}
 if(o.slow&&hard)t.slow=Math.max(t.slow,o.slow);
 if(o.kb&&hard){const fx0=o.fx??src.x,fy0=o.fy??src.y,a=Math.atan2(t.y-fy0,t.x-fx0);t.kx+=Math.cos(a)*o.kb;t.ky+=Math.sin(a)*o.kb;t.dash=null;t.z=0}
 if(t.hp<=0){t.hp=0;t.dead=true;t.cast=null;t.dash=null;t.spin=null;t.flame=null;winner=1-t.team;score[winner]++;state='roundEnd';stateT=2.8;sparks(t.x,t.y,'#fff',40);shake=.5;hs=.25;(winner===0?SFX.win:SFX.lose)()}
 return true;
}
function explode(p){p.boom=1;if(p.grenade)aoe(p.owner,p.x,p.y,p.ar||80,p.dmg,{stun:p.stun});else aoe(p.owner,p.x,p.y,p.ar||95,p.dmg,{kb:p.kb??550,stun:p.stun});sparks(p.x,p.y,p.col,24);shake=Math.max(shake,.2);SFX.boom()}

// ---------- Effets ----------
function say(u,s,col){txt.push({x:u.x+(rnd()-.5)*20,y:u.y,z:95,s,col,t:1})}
function sparks(x,y,col,n){for(let i=0;i<n;i++){const a=rnd()*7,s=80+rnd()*260;fx.push({x,y,z:20+rnd()*20,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5,m:.5,col,r:2+rnd()*2})}}
function ring(x,y,r,col){fx.push({x,y,ring:r,t:.35,m:.35,col})}

// ---------- IA générique (lit les indices "ai" de chaque capacité) ----------
function threat(u){for(const p of projs){if(p.owner.team===u.team||p.grenade)continue;const rx=u.x-p.x,ry=u.y-p.y,d=Math.hypot(rx,ry),v=Math.hypot(p.vx,p.vy);if(d<200&&(rx*p.vx+ry*p.vy)/(d*v)>.9)return p}return null}
function teleTarget(u){const ab=u.ch.abil[u.cast.i],a=u.cast.aimOv??u.aim;if(!ab.tele)return null;if(ab.tele.self)return{x:u.x,y:u.y,r:ab.tele.r};const d=clamp(u.cast.td,40,ab.tele.max);return{x:u.x+Math.cos(a)*d,y:u.y+Math.sin(a)*d,r:ab.tele.r}}
function dangers(u){const L=[];for(const z of zones)if(z.owner.team!==u.team)L.push(z);for(const p of projs)if(p.grenade&&p.owner.team!==u.team)L.push({x:p.tx,y:p.ty,r:p.ar||80});
 const e=foe(u);if(e.cast){const t=teleTarget(e);if(t)L.push(t)}if(e.spin)L.push({x:e.x,y:e.y,r:e.spin.r+10});return L}
function ai(u,e,dt){
 const d=dist(u,e),a=ang(u,e),tt=d/800;
 u.aim=Math.atan2(e.y+e.vy*tt*.6-u.y,e.x+e.vx*tt*.6-u.x)+(rnd()-.5)*.15;
 if((u.strT-=dt)<0){u.strT=.8+rnd()*1.5;u.strDir*=-1}
 const pref=u.ch.pref,rad=d>pref+40?1:d<pref-40?-1:0,sw=pref>200?.9:.5;
 let mx=Math.cos(a)*rad+Math.cos(a+Math.PI/2)*u.strDir*sw,my=Math.sin(a)*rad+Math.sin(a+Math.PI/2)*u.strDir*sw;
 if(orb&&(dist(u,orb)<dist(e,orb)||u.hp<u.max*.5)){const oa=ang(u,orb);mx=Math.cos(oa);my=Math.sin(oa)}
 if(dist(u,{x:CX,y:CY})>sdR()-60){const ca=ang(u,{x:CX,y:CY});mx=Math.cos(ca);my=Math.sin(ca)}
 for(const z of dangers(u))if(Math.hypot(u.x-z.x,u.y-z.y)<z.r+28){const za=Math.atan2(u.y-z.y,u.x-z.x);mx=Math.cos(za);my=Math.sin(za)}
 if((u.aiT-=dt)>0)return[mx,my];
 u.aiT=.13+rnd()*.17;
 const th=threat(u);
 for(const i of[5,3,1,2,4]){const ab=u.ch.abil[i],h=ab.ai;if(!h||u.cds[i]>0||(ab.ult&&u.energy<100))continue;
  let ok=false,aimO,td=d;
  switch(h.mode||'atk'){
   case'atk':ok=d>=(h.min||0)&&d<=h.max;break;
   case'gap':ok=d>=h.min&&d<=h.max;td=d-30;break;
   case'esc':ok=d<h.max||(th&&rnd()<.5);aimO=th?Math.atan2(th.vy,th.vx)+Math.PI/2*(rnd()<.5?1:-1):a+Math.PI+(rnd()-.5);td=300;break;
   case'def':ok=!!th||(d<110&&(e.swing>0||e.spin))||(e.cast&&d<300);break;
   case'self':ok=d<=h.max;break;
   case'heal':ok=u.hp<u.max*.6;break}
  if(ok&&rnd()<(h.p??.5)&&use(u,i,td,aimO))return[mx,my];
 }
 const l=u.ch.abil[0].ai;if(d<=l.max&&rnd()<l.p)use(u,0,d);
 return[mx,my];
}

// ---------- Mise à jour ----------
function collide(u){
 u.x=clamp(u.x,A.x+u.r,A.x+A.w-u.r);u.y=clamp(u.y,A.y+u.r,A.y+A.h-u.r);
 for(const p of pillars){const d=Math.hypot(u.x-p.x,u.y-p.y),m=p.r+u.r;if(d<m&&d>0){u.x=p.x+(u.x-p.x)/d*m;u.y=p.y+(u.y-p.y)/d*m}}
}
function updUnit(u,dt,active){
 for(let i=0;i<6;i++)u.cds[i]=Math.max(0,u.cds[i]-dt);
 for(const k of['stun','deflect','slow','haste','rage','rapid','unstop','swing'])u[k]=Math.max(0,u[k]-dt);u.flash-=dt;
 if(u.shieldT>0){u.shieldT-=dt;if(u.shieldT<=0)u.shield=0}
 if(u.dead){u.deadT+=dt;return}
 if(u.dash){const d=u.dash;d.t+=dt;const k=Math.min(1,d.t/d.dur);u.x=d.sx+(d.tx-d.sx)*k;u.y=d.sy+(d.ty-d.sy)*k;u.z=Math.sin(Math.PI*k)*d.jump;u.moving=0;
  fx.push({x:u.x,y:u.y,z:u.z+(u.ch.look.jet?20:30),vx:0,vy:0,t:.25,m:.25,col:u.ch.look.jet?'#f93':u.ch.look.weapon.t==='saber'?saberCol(u):'#aab',r:6});
  const e=foe(u);if(d.dmg&&!d.hitDone&&!e.dead&&dist(u,e)<u.r+e.r+12){d.hitDone=true;hit(e,u,d.dmg,{melee:1,slow:1,kb:d.kb})}
  if(k>=1){u.dash=null;u.z=0;d.end&&d.end()}collide(u);return}
 u.z=0;let mx=0,my=0;
 if(active&&u.stun<=0){
  if(u.team===0){
   const K=c=>keys[c]?1:0;
   mx=(K('KeyD')||K('ArrowRight'))-(K('KeyA')||K('ArrowLeft'));my=(K('KeyS')||K('ArrowDown'))-(K('KeyW')||K('ArrowUp'));
   const mw=unP(mouse.x,mouse.y);u.aim=Math.atan2(mw.y-u.y,mw.x-u.x);const td=Math.hypot(mw.x-u.x,mw.y-u.y);
   if(u.cast)u.cast.td=td;
   if(mouse.l)use(u,0,td);if(pressed.rmb)use(u,1,td);if(pressed.Space)use(u,2,td);if(pressed.KeyQ)use(u,3,td);if(pressed.KeyE)use(u,4,td);if(pressed.KeyR)use(u,5,td);
  }else[mx,my]=ai(u,foe(u),dt);
 }
 if(u.cast){u.cast.t+=dt;if(u.cast.t>=u.cast.dur){const c=u.cast;u.cast=null;u.ch.abil[c.i].f(u,c.aimOv??u.aim,c.td)}}
 if(u.spin){const s=u.spin;s.t-=dt;s.k-=dt;u.swing=.18;u.swingA+=dt*22;if(s.k<=0){s.k=.15;SFX.saber();aoe(u,u.x,u.y,s.r,s.dmg,{quiet:1},saberCol(u))}if(s.t<=0)u.spin=null}
 if(u.flame){const f=u.flame;f.t-=dt;f.k-=dt;for(let i=0;i<3;i++){const b=u.aim+(rnd()-.5)*.6,s=350+rnd()*150;fx.push({x:u.x+Math.cos(u.aim)*20,y:u.y+Math.sin(u.aim)*20,z:26,vx:Math.cos(b)*s,vy:Math.sin(b)*s,t:.4,m:.4,col:rnd()<.5?'#f93':'#fc4',r:4+rnd()*3})}
  if(f.k<=0){f.k=.12;SFX.flame();const e=foe(u);if(!e.dead&&dist(u,e)<175+e.r&&angDiff(ang(u,e),u.aim)<.4)hit(e,u,3.5,{slow:.5})}if(f.t<=0)u.flame=null}
 const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 const sp=u.ch.spd*(u.slow>0?.55:1)*(u.haste>0?1.4:1)*(u.cast?.4:1)*(u.flame?.5:1)*(u.spin?.8:1);u.vx=mx*sp;u.vy=my*sp;
 u.x+=(u.vx+u.kx)*dt;u.y+=(u.vy+u.ky)*dt;const dec=Math.exp(-7*dt);u.kx*=dec;u.ky*=dec;
 u.moving=l>.1;if(u.moving){u.walk+=dt*13*(u.haste>0?1.4:1);if(rnd()<dt*9)fx.push({x:u.x+(rnd()-.5)*10,y:u.y+4,z:2,vx:(rnd()-.5)*30,vy:(rnd()-.5)*20,t:.5,m:.5,col:'#5a6478',r:3})}
 if(u.haste>0&&rnd()<dt*20)fx.push({x:u.x,y:u.y,z:20+rnd()*30,vx:(rnd()-.5)*40,vy:(rnd()-.5)*40,t:.4,m:.4,col:u.rage>0?'#f44':'#fc6',r:3});
 collide(u);
 if(active&&dist(u,{x:CX,y:CY})>sdR())hit(u,null,14*dt,{silent:1});
}
function update(dt){
 if(state==='menu'){if(pressed.lmb)cards.forEach(c=>{if(inRect(mouse,c))startMatch(c.c)});return}
 if(state==='matchEnd'){if(pressed.lmb||pressed.Enter||pressed.Space)state='menu';return}
 stateT-=dt;shake=Math.max(0,shake-dt);flashS=Math.max(0,flashS-dt);
 if(state==='countdown'&&stateT<=0){state='fight';banner={s:'COMBATTEZ !',t:1.2}}
 if(state==='roundEnd'&&stateT<=0){if(score[0]>=2||score[1]>=2)state='matchEnd';else{round++;startRound()}}
 const active=state==='fight';
 if(active){const before=timer;timer+=dt;if(before<SD_START&&timer>=SD_START){banner={s:'MORT SUBITE : l\'arène se referme',t:2.5};SFX.lose()}}
 if(banner&&(banner.t-=dt)<=0)banner=null;
 if(active&&!orb&&!orbUsed&&timer>18){orb={x:CX,y:CY};ring(CX,CY,60,'#6f9');banner={s:'Un holocron apparaît au centre',t:1.8}}
 for(const u of units)updUnit(u,dt,active);
 const [a,b]=units,d=dist(a,b),m=a.r+b.r;if(d<m&&d>0&&!a.dead&&!b.dead){const px=(b.x-a.x)/d*(m-d)/2,py=(b.y-a.y)/d*(m-d)/2;a.x-=px;a.y-=py;b.x+=px;b.y+=py}
 if(orb&&active)for(const u of units)if(!u.dead&&dist(u,orb)<u.r+16){u.hp=Math.min(u.max,u.hp+30);u.energy=Math.min(100,u.energy+35);say(u,'+30 HOLOCRON','#6f9');sparks(orb.x,orb.y,'#6f9',30);fx.push({light:1,x:orb.x,y:orb.y,r:200,t:.5,m:.5,col:'#6f9'});SFX.orb();orb=null;orbUsed=true;break}
 for(const z of zones){z.t-=dt;if(z.t<=0){z.done=1;aoe(z.owner,z.x,z.y,z.r,z.dmg,z.o,z.col);SFX.zap();SFX.boom();shake=Math.max(shake,.25);
  for(let i=0;i<4;i++)fx.push({bolt:2,x:z.x+(rnd()-.5)*z.r,y:z.y+(rnd()-.5)*z.r*.8,t:.3,m:.3,col:z.col})}}
 zones=zones.filter(z=>!z.done);
 for(const p of projs){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*25;
  if(p.rocket)fx.push({x:p.x,y:p.y,z:28,vx:(rnd()-.5)*40,vy:(rnd()-.5)*40,t:.3,m:.3,col:'#fa3',r:4});
  let dead=p.life<=0||p.x<A.x||p.x>A.x+A.w||p.y<A.y||p.y>A.y+A.h;
  if(!p.grenade)for(const pl of pillars)if(Math.hypot(p.x-pl.x,p.y-pl.y)<pl.r+p.r)dead=true;
  const t=units[1-p.owner.team];
  if(!dead&&!p.grenade&&!t.dead&&Math.hypot(t.x-p.x,t.y-p.y)<t.r+p.r){
   if(t.deflect>0)reflect(p,t);
   else{if(!p.rocket)hit(t,p.owner,p.dmg);dead=true}
  }
  if(dead){p.dead=1;if((p.grenade||p.rocket)&&!p.boom)explode(p);else if(!p.boom)sparks(p.x,p.y,p.col,4);if(p.saber)p.src.saberOut=0}
 }
 projs=projs.filter(p=>!p.dead);
 for(const f of fx){f.t-=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}}fx=fx.filter(f=>f.t>0);
 for(const t of txt){t.t-=dt;t.z+=40*dt}txt=txt.filter(t=>t.t>0);
}

// ---------- Rendu : caméra 3/4 en plongée (comme Battlerite) ----------
const TOP=170,HS=415,K=HS/A.h;
const sc=y=>.82+.3*((y-A.y)/A.h);
function P(x,y,z=0){const s=sc(y);return{x:W/2+(x-CX)*s,y:TOP+(y-A.y)*K-z*s,s}}
function unP(mx,my){const y=A.y+(my-TOP)/K;return{x:CX+(mx-W/2)/sc(y),y}}
function gEll(x,y,r,a0=0,a1=7){const p=P(x,y);g.beginPath();g.ellipse(p.x,p.y,r*p.s,r*p.s*K,0,a0,a1)}

 if(u.saberOut>0||u.dead)return;

 g.strokeStyle='#bbb';g.lineWidth=4;g.beginPath();g.moveTo(hx-ux*5,hy-uy*5+2);g.lineTo(hx+ux*3,hy+uy*3-1);g.stroke();

function drawChar(u,bx,by,s){
 const L=u.ch.look,a=u.swing>0?u.swingA+(u.spin?0:(1-u.swing/.18-.5)*1.9):u.aim;
 const fx=Math.cos(u.aim),fy=Math.sin(u.aim),back=fy<-.3,fl=u.flash>0;
 const step=u.moving?Math.sin(u.walk):0,bob=u.moving?Math.abs(Math.cos(u.walk))*1.6:0,sk=L.scale||1;
 g.save();g.translate(bx,by);g.scale(s*sk,s*sk);
 if(u.dead){g.globalAlpha=Math.max(.25,1-u.deadT);g.rotate(Math.min(1.4,u.deadT*6)*(fx<0?-1:1))}
 const lw=L.bony?3:5;g.fillStyle=fl?'#fff':L.legs;g.fillRect(-6+step*3,-17,lw,14);g.fillRect(2-step*3,-17,lw,14);

 if(L.cape&&!back)poly([{x:-11,y:-40},{x:11,y:-40},{x:17-step,y:-3},{x:-17-step,y:-3}],L.cape);
 if(back)drawWeapon(u,a,L);
 if(L.jet&&!back){g.fillStyle='#6b7680';g.fillRect(-14,-38,6,17);g.fillRect(8,-38,6,17)}
 if(L.robe)poly([{x:-12,y:-40},{x:12,y:-40},{x:17+step*2,y:-6},{x:-17+step*2,y:-6}],fl?'#fff':L.robe);
 const tw=L.bony?8:11;poly([{x:-tw,y:-39},{x:tw,y:-39},{x:tw+(L.robe||L.fur?4:0),y:-15},{x:-tw-(L.robe||L.fur?4:0),y:-15}],fl?'#fff':L.torso);
 if(!back){
  if(L.tunic)poly([{x:-5,y:-39},{x:5,y:-39},{x:6,y:-15},{x:-6,y:-15}],fl?'#fff':L.tunic);
  if(L.vest){poly([{x:-11,y:-39},{x:-4,y:-39},{x:-5,y:-18},{x:-13,y:-18}],L.vest);poly([{x:11,y:-39},{x:4,y:-39},{x:5,y:-18},{x:13,y:-18}],L.vest)}
  if(L.armor){g.fillStyle=fl?'#fff':L.armor;g.beginPath();g.roundRect(-9,-38,18,11,3);g.fill()}
  if(L.chest){g.fillStyle='#333';g.fillRect(-5,-33,10,6);g.fillStyle='#f33';g.fillRect(-3,-31,2,2);g.fillStyle='#3af';g.fillRect(1,-31,2,2)}
  if(L.bony){g.strokeStyle='#999';g.lineWidth=1;for(let i=0;i<3;i++){g.beginPath();g.moveTo(-6,-34+i*5);g.lineTo(6,-34+i*5);g.stroke()}}
 }else{if(L.jet){g.fillStyle='#6b7680';g.beginPath();g.roundRect(-10,-40,20,20,4);g.fill();g.fillStyle='#ff9a3a';g.fillRect(-7,-23,4,3);g.fillRect(3,-23,4,3);
   if(u.dash){g.fillStyle='#ffcf5a';g.beginPath();g.moveTo(-8,-20);g.lineTo(-5,-4-rnd()*10);g.lineTo(-2,-20);g.moveTo(2,-20);g.lineTo(5,-4-rnd()*10);g.lineTo(8,-20);g.fill()}}
  if(L.cape)poly([{x:-12,y:-40},{x:12,y:-40},{x:16-step,y:-6},{x:-16-step,y:-6}],L.cape)}
 if(L.fur){g.strokeStyle='#5a3a1e';g.lineWidth=1.2;for(let i=0;i<6;i++){const x=-10+i*4;g.beginPath();g.moveTo(x,-36+(i%2)*4);g.lineTo(x+1,-30+(i%2)*4);g.stroke()}}

 drawHead(u,L,fx*1.5,-50,fx,back,fl);

 g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;for(let x=A.x+100;x<A.x+A.w;x+=100){const a=P(x,A.y);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x,a.y-B*a.s);g.stroke()}
 for(let x=A.x+150;x<A.x+A.w;x+=200){const a=P(x,A.y,B*.8),b=P(x+80,A.y,B*.8);g.fillStyle='rgba(120,180,255,.18)';g.fillRect(a.x,a.y,b.x-a.x,10)}
 g.fillStyle='#ff9a3a';g.globalAlpha=.6;poly([up(tl,B*.55),up(tr,B*.55),up(tr,B*.5),up(tl,B*.5)]);g.fill();g.globalAlpha=1;
 poly([tl,bl,up(bl,40),up(tl,B)],'#161c2a');poly([tr,br,up(br,40),up(tr,B)],'#161c2a');
 const fg=g.createLinearGradient(0,tl.y,0,bl.y);fg.addColorStop(0,'#141a26');fg.addColorStop(1,'#1d2433');poly([tl,tr,br,bl],fg);
 const cg=g.createRadialGradient(W/2,P(CX,CY).y,10,W/2,P(CX,CY).y,420);cg.addColorStop(0,'rgba(90,120,170,.12)');cg.addColorStop(1,'rgba(90,120,170,0)');poly([tl,tr,br,bl],cg);
 g.strokeStyle='rgba(120,160,220,.07)';g.lineWidth=1;
 for(let x=A.x;x<=A.x+A.w;x+=50){const a=P(x,A.y),b=P(x,A.y+A.h);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
 for(let y=A.y;y<=A.y+A.h;y+=50){const a=P(A.x,y),b=P(A.x+A.w,y);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
 g.strokeStyle='rgba(255,232,31,.14)';g.lineWidth=3;gEll(CX,CY,90);g.stroke();gEll(CX,CY,30);g.stroke();
 const m0=P(CX,A.y),m1=P(CX,A.y+A.h);g.beginPath();g.moveTo(m0.x,m0.y);g.lineTo(m1.x,m1.y);g.stroke();
 g.strokeStyle='rgba(77,184,255,.18)';gEll(A.x+150,CY,40);g.stroke();g.strokeStyle='rgba(255,77,77,.18)';gEll(A.x+A.w-150,CY,40);g.stroke();
 g.save();g.shadowColor='#3a7bd5';g.shadowBlur=14;g.strokeStyle='#2c4a78';g.lineWidth=3;g.beginPath();g.moveTo(bl.x,bl.y);g.lineTo(br.x,br.y);g.stroke();g.restore();
 const R=sdR();if(R<2000){const c=P(CX,CY),t=performance.now()/200;g.save();poly([tl,tr,br,bl]);g.clip();
  g.beginPath();g.rect(0,0,W,H);g.ellipse(c.x,c.y,R*c.s,R*c.s*K,0,0,7);g.fillStyle=`rgba(255,40,40,${.16+Math.sin(t)*.05})`;g.fill('evenodd');
  g.strokeStyle='#ff4040';g.lineWidth=3;g.setLineDash([12,8]);g.lineDashOffset=-t*6;gEll(CX,CY,R);g.stroke();g.setLineDash([]);g.restore()}
 if(orb){const t=performance.now()/300,p=P(orb.x,orb.y,30+Math.sin(t)*6);g.fillStyle='rgba(60,255,150,.15)';gEll(orb.x,orb.y,26);g.fill();
  g.save();g.shadowColor='#6f9';g.shadowBlur=25;g.translate(p.x,p.y);g.rotate(t*.5);g.fillStyle='#3d9';g.fillRect(-10,-10,20,20);g.strokeStyle='#bfc';g.lineWidth=2;g.strokeRect(-12,-12,24,24);g.restore()}
}
function glow(x,y,r,col,a){const p=P(x,y),gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r*p.s);gr.addColorStop(0,rgba(col,a));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.beginPath();g.ellipse(p.x,p.y,r*p.s,r*p.s*K,0,0,7);g.fill()}
function drawLights(){
 g.save();g.globalCompositeOperation='lighter';
 for(const u of units){if(u.dead)continue;const w=u.ch.look.weapon;if(w.t==='saber'&&u.saberOut<=0)glow(u.x+Math.cos(u.aim)*20,u.y+Math.sin(u.aim)*20,85,w.col,.22);if(w.two)glow(u.x,u.y,60,w.two,.15);if(u.haste>0)glow(u.x,u.y,60,u.rage>0?'#f33':'#fc6',.2);if(u.flame)glow(u.x+Math.cos(u.aim)*90,u.y+Math.sin(u.aim)*90,120,'#f93',.3)}
 for(const p of projs)glow(p.x,p.y,p.rocket?90:45,p.col,.3);
 for(const f of fx)if(f.light)glow(f.x,f.y,f.r,f.col,.45*f.t/f.m);
 if(orb)glow(orb.x,orb.y,90,'#6f9',.25);
 g.restore();
}
function drawTelegraphs(){
 for(const z of zones){const k=1-z.t/z.m;g.fillStyle=rgba(z.col,.12);gEll(z.x,z.y,z.r);g.fill();g.fillStyle=rgba(z.col,.3);gEll(z.x,z.y,z.r*k);g.fill();g.strokeStyle=z.col;g.lineWidth=2;gEll(z.x,z.y,z.r);g.stroke()}
 for(const p of projs)if(p.grenade){g.strokeStyle='rgba(255,90,90,.8)';g.lineWidth=2;g.setLineDash([6,5]);gEll(p.tx,p.ty,p.ar||80);g.stroke();g.setLineDash([])}
 for(const u of units){if(!u.cast||u.dead)continue;const ab=u.ch.abil[u.cast.i],t=teleTarget(u),k=u.cast.t/u.cast.dur,col=u.team?'#ff5050':'#5ab8ff';
  if(t){g.fillStyle=rgba(col,.12);gEll(t.x,t.y,t.r);g.fill();g.fillStyle=rgba(col,.28);gEll(t.x,t.y,t.r*k);g.fill();g.strokeStyle=col;g.lineWidth=2;gEll(t.x,t.y,t.r);g.stroke()}
  else{const a=u.cast.aimOv??u.aim,len=ab.line?.len||500,w=ab.line?.w||14,c1=P(u.x,u.y),pts=[[-w/2,0],[w/2,0],[w/2,len],[-w/2,len]].map(([s,f])=>P(u.x+Math.cos(a)*f-Math.sin(a)*s,u.y+Math.sin(a)*f+Math.cos(a)*s));
   poly(pts,rgba(col,.15));const e=P(u.x+Math.cos(a)*len*k,u.y+Math.sin(a)*len*k);g.strokeStyle=rgba(col,.7);g.lineWidth=2;g.beginPath();g.moveTo(c1.x,c1.y);g.lineTo(e.x,e.y);g.stroke()}}
}
function drawBolt(x0,y0,x1,y1,col){g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();g.moveTo(x0,y0);const n=7;for(let i=1;i<=n;i++){const k=i/n;g.lineTo(lerp(x0,x1,k)+(i<n?(rnd()-.5)*22:0),lerp(y0,y1,k)+(i<n?(rnd()-.5)*22:0))}g.stroke()}

// ---------- Menu : panel de personnages ----------
function drawMenu(){
 g.save();g.shadowColor='#ffe81f';g.shadowBlur=18;text('STAR WARS · ARÈNE',W/2,62,46,'#ffe81f');g.restore();
 text('Héros contre méchants · 1 contre 1 · au meilleur des 3 manches · choisis ton personnage',W/2,92,16,'#9fb3d9','center','normal');
 text('HÉROS',82,121,13,'#7fc4ff','left');text('MÉCHANTS',82,323,13,'#ff8a8a','left');
 const t=performance.now()/1000;let hov=null;
 cards.forEach((c,i)=>{const h=inRect(mouse,c),ch=CH[c.c];if(h)hov=c.c;const sideC=ch.side?'#ff6060':'#4db8ff';
  g.fillStyle=h?'rgba(22,34,58,.95)':'rgba(13,20,36,.88)';g.strokeStyle=h?'#ffe81f':rgba(sideC,.35);g.lineWidth=2;g.beginPath();g.roundRect(c.x,c.y,c.w,c.h,10);g.fill();g.stroke();
  const fake=mkUnit(c.c,0,0,ch.side);fake.aim=Math.PI/2+Math.sin(t*.8+i)*.9;fake.moving=h;fake.walk=t*13;
  const fy=c.y+108;g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.ellipse(c.x+c.w/2,fy,26,8,0,0,7);g.fill();
  if(ch.look.weapon.t==='saber'){g.save();g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(c.x+c.w/2,fy,0,c.x+c.w/2,fy,60);gr.addColorStop(0,rgba(ch.look.weapon.col,.18));gr.addColorStop(1,rgba(ch.look.weapon.col,0));g.fillStyle=gr;g.fillRect(c.x,c.y,c.w,c.h);g.restore()}
  drawChar(fake,c.x+c.w/2,fy,1.45);
  text(ch.name,c.x+c.w/2,c.y+136,15,'#fff');
  text(ch.desc,c.x+c.w/2,c.y+155,11,'#9fb3d9','center','normal');
 });
 if(hov)hover=hov;
 const ch=CH[hover],y=520;
 g.fillStyle='rgba(13,20,36,.9)';g.strokeStyle='#2a3a5a';g.lineWidth=1;g.beginPath();g.roundRect(82,y,1115,128,10);g.fill();g.stroke();
 text(ch.name,102,y+30,22,ch.side?'#ff9a9a':'#9fd4ff','left');
 text(`${ch.hp} PV · vitesse ${ch.spd} · ${ch.desc}`,102,y+52,13,'#9fb3d9','left','normal');
 ch.abil.forEach((ab,j)=>{const x=102+(j%3)*370,yy=y+80+Math.floor(j/3)*24;
  text(lbl[SLOTS[j]],x,yy,13,ab.ult?'#ffe81f':'#fff','left');
  text(`${ab.n}${ab.ult?' · ultime (100 énergie)':` · ${ab.cd}s`}${ab.cast?` · incantation ${ab.cast}s`:''}`,x+58,yy,13,ab.ult?'#ffe81f':'#cbd6ee','left','normal')});
 text(`${lbl.KeyW}${lbl.KeyA}${lbl.KeyS}${lbl.KeyD} ou flèches pour bouger · souris pour viser · ${lbl.KeyM} pour couper le son · holocron de soin à 18 s · mort subite à 45 s`,W/2,686,14,'#7f93b8','center','normal');
 drawCursor();
}
function bar(x,y,w,h,v,col,right){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,y,w,h);g.fillStyle=col;const vw=w*clamp(v,0,1);g.fillRect(right?x+w-vw:x,y,vw,h);g.strokeStyle='#2a3a5a';g.lineWidth=1;g.strokeRect(x,y,w,h)}
function drawHud(){
 const p=units[0],e=units[1];
 text(p.ch.name+' (toi)',30,32,18,'#9fd4ff','left');bar(30,40,360,16,p.hp/p.max,'#4db8ff');bar(30,59,360,5,p.energy/100,'#ffe81f');
 text(e.ch.name,W-30,32,18,'#ffa0a0','right');bar(W-390,40,360,16,e.hp/e.max,'#ff4d4d',1);bar(W-390,59,360,5,e.energy/100,'#ffe81f',1);
 text(`${score[0]}  —  ${score[1]}`,W/2,40,30,'#ffe81f');
 text(timer<SD_START?`Manche ${round} · mort subite dans ${Math.ceil(SD_START-timer)} s`:`Manche ${round} · MORT SUBITE`,W/2,60,13,timer<SD_START?'#9fb3d9':'#ff6060','center','normal');
 const n=6,s=92,gap=8,x0=W/2-(n*s+(n-1)*gap)/2,y=H-72,sh=52;
 p.ch.abil.forEach((ab,i)=>{const x=x0+i*(s+gap),ready=ab.ult?p.energy>=100:p.cds[i]<=0,k=lbl[SLOTS[i]];
  g.fillStyle='rgba(13,19,32,.9)';g.fillRect(x,y,s,sh);
  g.strokeStyle=ab.ult?(ready?'#ffe81f':'#5a5020'):ready?'#4a6a9a':'#22304a';g.lineWidth=2;g.strokeRect(x,y,s,sh);
  text(k,x+s/2,y+24,k.length>2?13:20,ready?'#fff':'#667','center');
  if(ab.cast)text(`${ab.cast}s`,x+s-4,y+12,9,'#7f93b8','right','normal');
  if(!ab.ult&&p.cds[i]>0){const kk=Math.min(1,p.cds[i]/ab.cd);g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,y+sh*(1-kk),s,sh*kk);text(p.cds[i].toFixed(1),x+s/2,y+42,13,'#ffe81f')}
  if(ab.ult&&!ready){g.fillStyle='rgba(255,232,31,.25)';g.fillRect(x,y+sh*(1-p.energy/100),s,sh*p.energy/100)}
  text(ab.n,x+s/2,y+sh+13,10,'#9fb3d9','center','normal')});
 text(muted?`${lbl.KeyM} : son coupé`:`${lbl.KeyM} : son`,20,H-14,11,'#55607a','left','normal');

function drawCursor(){g.strokeStyle='#ffe81f';g.lineWidth=1.5;g.beginPath();g.ellipse(mouse.x,mouse.y,10,10*K,0,0,7);g.stroke();g.fillStyle='#ffe81f';g.fillRect(mouse.x-1,mouse.y-1,2,2)}
function draw(){
 drawSky();
 if(state==='menu'){g.fillStyle='rgba(4,5,11,.55)';g.fillRect(0,0,W,H);drawMenu();return}
 g.save();if(shake>0)g.translate((rnd()-.5)*shake*24,(rnd()-.5)*shake*24);
 drawArena();
 drawLights();
 drawTelegraphs();
 for(const f of fx){if(!f.ring&&!f.swing)continue;g.globalAlpha=f.t/f.m;g.strokeStyle=f.col;g.lineWidth=f.swing?6:4;
  if(f.ring)gEll(f.x,f.y,f.ring*(1.1-f.t/f.m*.6));else gEll(f.x,f.y,f.range,f.a-f.arc/2,f.a+f.arc/2);g.stroke()}g.globalAlpha=1;
 const me=units[0];if(state==='fight'&&!me.dead){const ex=me.x+Math.cos(me.aim)*70,ey=me.y+Math.sin(me.aim)*70,a=P(me.x+Math.cos(me.aim)*28,me.y+Math.sin(me.aim)*28),b=P(ex,ey);
  g.strokeStyle='rgba(120,200,255,.45)';g.lineWidth=3;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
 const list=[...pillars.map(o=>({y:o.y,d:()=>drawPillar(o)})),...units.map(o=>({y:o.y,d:()=>drawUnit(o)})),...projs.map(o=>({y:o.y,d:()=>drawProj(o)}))];
 list.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
 g.save();g.globalCompositeOperation='lighter';
 for(const f of fx){if(f.bolt===1&&!f.u.dead){const h=P(f.u.x,f.u.y,40);g.globalAlpha=f.t/f.m;for(let i=0;i<f.n;i++){const b=f.a+(rnd()-.5)*.8,e=P(f.u.x+Math.cos(b)*f.range,f.u.y+Math.sin(b)*f.range,25);drawBolt(h.x,h.y,e.x,e.y,i%2?'#fff':f.col)}}
  if(f.bolt===2){const top=P(f.x,f.y,300),bot=P(f.x,f.y);g.globalAlpha=f.t/f.m;drawBolt(top.x,top.y,bot.x,bot.y,f.col);drawBolt(top.x,top.y,bot.x,bot.y,'#fff')}}
 g.restore();g.globalAlpha=1;
 for(const f of fx){if(f.ring||f.swing||f.bolt||f.light)continue;const p=P(f.x,f.y,f.z??20);g.globalAlpha=f.t/f.m;g.fillStyle=f.col;g.beginPath();g.arc(p.x,p.y,f.r*p.s,0,7);g.fill()}g.globalAlpha=1;
 for(const t of txt){const p=P(t.x,t.y,t.z);g.globalAlpha=Math.min(1,t.t*2);g.lineWidth=3;g.strokeStyle='rgba(0,0,0,.6)';g.font='bold 15px "Trebuchet MS",system-ui,sans-serif';g.textAlign='center';g.strokeText(t.s,p.x,p.y);text(t.s,p.x,p.y,15,t.col)}g.globalAlpha=1;
 g.restore();
 const vg=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=vg;g.fillRect(0,0,W,H);
 if(flashS>0){g.fillStyle=`rgba(255,255,255,${flashS*1.2})`;g.fillRect(0,0,W,H)}
 drawHud();
 if(banner&&state==='fight'){g.globalAlpha=Math.min(1,banner.t*2);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,H/2-130,W,46);text(banner.s,W/2,H/2-98,26,banner.s.startsWith('MORT')?'#ff6060':'#ffe81f');g.globalAlpha=1}
 if(state==='countdown'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);text(`Manche ${round}`,W/2,H/2-60,28,'#9fb3d9');text(`${units[0].ch.name}  contre  ${units[1].ch.name}`,W/2,H/2-30,18,'#dfe8ff','center','normal');text(String(Math.ceil(stateT)),W/2,H/2+50,90,'#ffe81f')}
 if(state==='roundEnd'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);text(winner===0?'Manche gagnée':'Manche perdue',W/2,H/2,54,winner===0?'#7fd4ff':'#ff7a7a')}
 if(state==='matchEnd'){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);const win=score[0]>score[1],light=units[0].ch.side===0;
  g.save();g.shadowColor='#ffe81f';g.shadowBlur=24;text(win?'VICTOIRE':'DÉFAITE',W/2,H/2-10,84,win?'#ffe81f':'#ff5a5a');g.restore();
  text(win===light?'La Force est avec toi.':'Le côté obscur l\'emporte…',W/2,H/2+40,22,'#dfe8ff','center','normal');
  text('Clic ou Entrée pour revenir au menu',W/2,H/2+90,16,'#9fb3d9','center','normal')}
 drawCursor();
}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const udt=hs>0?0:dt;hs=Math.max(0,hs-dt);update(udt);draw();pressed={};requestAnimationFrame(loop)}
requestAnimationFrame(loop);
