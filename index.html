function startMatch(c){playerChamp=c;const o=HEROES.filter(x=>CH[x].side!==CH[c].side);aiChamp=o[Math.floor(rnd()*o.length)];score=[0,0];round=1;mode==='arena'?startRound():startBattle()}
function resetWorld(){projs=[];fx=[];txt=[];zones=[];orb=null;orbUsed=false;timer=0;banner=null;killfeed=[];state='countdown';stateT=3}
function startRound(){B=A;OBST=ARENA_OBST;cam={x:CX,y:CY};Yc=377.5;units=[mkUnit(playerChamp,A.x+150,CY,0),mkUnit(aiChamp,A.x+A.w-150,CY,1)];player=units[0];resetWorld()}
const spawnPos=t=>({x:t?MAP.w-150-rnd()*150:150+rnd()*150,y:MAP.h/2+(rnd()-.5)*1000});
function startBattle(){
 B=MAP;OBST=battleObstacles();Yc=390;tickets=[100,100];
 const side=CH[playerChamp].side,mine=HEROES.filter(h=>CH[h].side===side&&h!==playerChamp),theirs=HEROES.filter(h=>CH[h].side!==side);
 const pick=(arr,n)=>arr.slice().sort(()=>rnd()-.5).slice(0,n);
 const mk=(c,t)=>{const p=spawnPos(t);return mkUnit(c,p.x,p.y,t)};
 units=[mk(playerChamp,0)];player=units[0];
 for(const h of pick(mine,3))units.push(mk(h,0));
 for(const h of pick(theirs,4))units.push(mk(h,1));
 for(let i=0;i<16;i++){units.push(mk(side?'storm':'rebel',0));units.push(mk(side?'rebel':'storm',1))}
 pickups=[[1100,500],[1100,1500],[2100,1000],[3100,500],[3100,1500],[2100,300],[2100,1700]].map(([x,y])=>({x,y,t:0}));
 cam={x:player.x,y:player.y};resetWorld();
}
function battleObstacles(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647,o=[];
 for(let i=0;i<70&&o.length<48;i++){const x=520+r()*3160,y=140+r()*1720;if(o.some(p=>Math.hypot(p.x-x,p.y-y)<190)||Math.hypot(x-2100,y-1000)<120)continue;o.push({x,y,r:24+r()*24,rock:r()<.55})}return o}
const enemies=u=>units.filter(e=>e.team!==u.team&&!e.dead);

// ---------- Mécaniques ----------
function use(u,i,td,aimOv,ex){const ab=u.ch.abil[i];if(!ab||u.cds[i]>0||u.stun>0||u.dash||u.cast||u.spin||u.flame||u.block)return false;if(ab.ult&&u.energy<100)return false;if((ab.throw||ab.melee)&&u.saberOut>0)return false;
 ex=!!(ex&&i>0&&!ab.ult&&u.energy>=25);if(ex)u.energy-=25;
 u.cds[i]=(ab.cd||1)*(i===0&&u.rapid>0?.45:1);if(ab.ult){u.energy-=100;if(u===player)flashS=.25;if(near(u.x,u.y))shake=.3}
 if(ab.cast){u.cast={i,t:0,dur:ab.cast,td:td??200,aimOv,ex};return true}
 fire(u,ab,aimOv??u.aim,td??200,ex);return true}
function fire(u,ab,a,td,ex){EX=ex;if(ex){ring(u.x,u.y,46,'#ffe81f');say(u,'EX','#ffe81f');S('ex',u)}ab.f(u,a,td);EX=false}
function proj(u,a,o){projs.push(Object.assign({x:u.x+Math.cos(a)*24,y:u.y+Math.sin(a)*24,vx:Math.cos(a)*o.spd,vy:Math.sin(a)*o.spd,owner:u,src:u,rot:0,life0:o.life,ex:EX,hitSet:null},o))}
function melee(u,a,range,arc,dmg){u.swing=.18;u.swingA=a;S('saber',u);fx.push({x:u.x,y:u.y,swing:1,a,range,arc,t:.18,m:.18,col:saberCol(u)});
 for(const e of enemies(u))if(dist(u,e)<range+e.r&&angDiff(ang(u,e),a)<arc/2&&hit(e,u,dmg,{melee:1,ex:EX})&&(u===player||e===player))hs=.05;
 for(const p of projs)if(p.owner.team!==u.team&&!p.rocket&&!p.grenade&&Math.hypot(p.x-u.x,p.y-u.y)<range&&angDiff(Math.atan2(p.y-u.y,p.x-u.x),a)<arc/2&&rnd()<.5)reflect(p,u)}
function cone(u,a,range,arc,dmg,o,col){if(near(u.x,u.y))for(let i=0;i<24;i++){const b=a+(rnd()-.5)*arc,s=300+rnd()*300;fx.push({x:u.x,y:u.y,vx:Math.cos(b)*s,vy:Math.sin(b)*s,t:.4,m:.4,col,r:3})}
 for(const e of enemies(u))if(dist(u,e)<range+e.r&&angDiff(ang(u,e),a)<arc/2)hit(e,u,dmg,Object.assign({melee:1,ex:EX},o))}
function lightning(u,a,o){fx.push({bolt:1,u,a,range:o.range,n:o.small?2:4,t:o.small?.15:.3,m:o.small?.15:.3,col:'#b8f'});if(!o.small)fx.push({light:1,x:u.x+Math.cos(a)*100,y:u.y+Math.sin(a)*100,r:180,t:.3,m:.3,col:'#b8f'});
 let healed=false;for(const e of enemies(u))if(dist(u,e)<o.range+e.r&&angDiff(ang(u,e),a)<o.arc/2&&hit(e,u,o.dmg,{slow:o.slow,melee:1,ex:EX})&&o.heal&&!healed){healed=true;u.hp=Math.min(u.max,u.hp+o.heal);say(u,'+'+o.heal,'#6f9')}}
function aoe(u,x,y,r,dmg,o={},col){col=col||(o.stun?'#b8f':'#fc6');if(near(x,y)){ring(x,y,r,col);if(!o.quiet)fx.push({light:1,x,y,r:r*1.6,t:.35,m:.35,col})}
 for(const e of enemies(u))if(Math.hypot(e.x-x,e.y-y)<r+e.r&&hit(e,u,dmg,Object.assign({fx:x,fy:y,ex:EX},o))&&(u===player||e===player))hs=Math.max(hs,dmg>20?.1:.03)}
function dash(u,a,d,dur,o={}){const tx=clamp(u.x+Math.cos(a)*d,B.x+u.r,B.x+B.w-u.r),ty=clamp(u.y+Math.sin(a)*d,B.y+u.r,B.y+B.h-u.r);u.dash={sx:u.x,sy:u.y,tx,ty,t:0,dur,jump:o.jump||0,end:o.end,dmg:o.dmg,kb:o.kb,hitDone:false,ex:EX}}
function reflect(p,t){p.owner=t;p.vx*=-1.1;p.vy*=-1.1;p.life=Math.max(p.life,.7);p.hitSet=null;if(near(t.x,t.y)){say(t,'RENVOI !','#7df');sparks(p.x,p.y,'#7df',8);S('deflect',t)}}
// parade : le tir repart vers celui qui l'a tiré
function parry(p,t){const sh=p.owner,a=sh&&!sh.dead?Math.atan2(sh.y-p.y,sh.x-p.x)+(rnd()-.5)*.12:Math.atan2(-p.vy,-p.vx),sp=Math.hypot(p.vx,p.vy)*1.05;
 p.owner=t;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=Math.max(p.life,.8);p.hitSet=null;t.swing=.12;t.swingA=a;
 if(near(t.x,t.y)){sparks(p.x,p.y,saberCol(t),6);S('deflect',t)}stamHit(t,p.heavy?14:6)}
const facing=(t,pt)=>angDiff(Math.atan2(pt.y-t.y,pt.x-t.x),t.aim)<1.3;
function stamHit(t,v){t.stam-=v;if(t.stam<=0){t.stam=0;t.block=false;t.blockLock=2;t.stun=Math.max(t.stun,.7);say(t,'GARDE BRISÉE','#fc6')}}
function hit(t,src,dmg,o={}){
 if(t.dead||state!=='fight')return false;
 if(src&&t.block&&o.melee&&!o.unblockable&&facing(t,src)){stamHit(t,o.ex?25:14);if(near(t.x,t.y)){say(t,'PARADE','#7df');sparks(t.x,t.y,saberCol(t),10);S('deflect',t)}const a=ang(t,src);src.kx+=Math.cos(a)*220;src.ky+=Math.sin(a)*220;return false}
 if(src&&t.deflect>0&&o.melee){src.stun=Math.max(src.stun,.9);src.cast=null;src.spin=null;t.deflect=0;say(t,'RENVOI !','#7df');say(src,'ÉTOURDI','#b8f');sparks(t.x,t.y,'#7df',14);S('deflect',t);return false}
 if(src&&src.rage>0)dmg*=1.35;if(o.ex)dmg*=1.5;
 let d=dmg;if(t.shield>0){const ab=Math.min(t.shield,d);t.shield-=ab;d-=ab}
 t.hp-=d;
 if(!o.silent){t.flash=.12;if(src)src.energy=Math.min(100,src.energy+dmg*(src.hero?.6:0));if(t.hero)t.energy=Math.min(100,t.energy+dmg*.2);
  if(near(t.x,t.y)){if(Math.round(d)>0)say(t,'-'+Math.round(d),d<dmg?'#fc6':o.ex?'#ffe81f':'#fff');sparks(t.x,t.y,t.team?'#f66':'#6cf',6);if(t===player||src===player)shake=Math.max(shake,.08);S('hit',t)}}
 const hard=t.unstop<=0,xm=o.ex?1.4:1;
 if(o.stun&&hard){t.stun=Math.max(t.stun,o.stun*xm);say(t,'ÉTOURDI','#b8f')}
 if((o.stun||o.kb)&&hard&&(t.cast||t.spin||t.flame||t.block)){if(t.cast||t.spin||t.flame)say(t,'INTERROMPU','#fc6');t.cast=null;t.spin=null;t.flame=null}
 if(o.slow&&hard)t.slow=Math.max(t.slow,o.slow*xm);
 if(o.kb&&hard){const fx0=o.fx??src.x,fy0=o.fy??src.y,a=Math.atan2(t.y-fy0,t.x-fx0);t.kx+=Math.cos(a)*o.kb*xm;t.ky+=Math.sin(a)*o.kb*xm;t.dash=null;t.z=0}
 if(t.hp<=0)die(t,src);
 return true;
}
function die(t,src){t.hp=0;t.dead=true;t.deadT=0;t.cast=null;t.dash=null;t.spin=null;t.flame=null;t.block=false;
 if(near(t.x,t.y)){sparks(t.x,t.y,'#fff',t.hero?40:12);if(t.hero)shake=Math.max(shake,.3)}
 if(mode==='arena'){winner=1-t.team;score[winner]++;state='roundEnd';stateT=2.8;shake=.5;hs=.25;(winner===0?SFX.win:SFX.lose)();return}
 tickets[t.team]=Math.max(0,tickets[t.team]-(t.hero?5:1));t.respawn=t.hero?8:5;if(src&&src.hero)src.energy=Math.min(100,src.energy+10);
 if(t===player)deathPos={x:t.x,y:t.y};
 if(t.hero||(src&&(src.hero||src===player)))killfeed.unshift({a:src?src.ch.name:'Arène',b:t.ch.name,ta:src?src.team:2,tb:t.team,t:5});killfeed.length=Math.min(killfeed.length,6);
 if(tickets[t.team]<=0){state='matchEnd';winner=1-t.team;(winner===0?SFX.win:SFX.lose)()}
}
function explode(p){p.boom=1;EX=p.ex;if(p.grenade)aoe(p.owner,p.x,p.y,p.ar||80,p.dmg,{stun:p.stun,unblockable:1});else aoe(p.owner,p.x,p.y,p.ar||95,p.dmg,{kb:p.kb??550,stun:p.stun,unblockable:1});EX=false;if(near(p.x,p.y)){sparks(p.x,p.y,p.col,24);shake=Math.max(shake,.2);SFX.boom()}}

// ---------- Effets ----------
function say(u,s,col){if(near(u.x,u.y))txt.push({x:u.x+(rnd()-.5)*20,y:u.y,z:95,s,col,t:1})}
function sparks(x,y,col,n){for(let i=0;i<n;i++){const a=rnd()*7,s=80+rnd()*260;fx.push({x,y,z:20+rnd()*20,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5,m:.5,col,r:2+rnd()*2})}}
function ring(x,y,r,col){if(near(x,y))fx.push({x,y,ring:r,t:.35,m:.35,col})}

// ---------- IA générique (lit les indices "ai" de chaque capacité) ----------
function threat(u){for(const p of projs){if(p.owner.team===u.team||p.grenade)continue;const rx=u.x-p.x,ry=u.y-p.y,d=Math.hypot(rx,ry);if(d>220)continue;const v=Math.hypot(p.vx,p.vy);if((rx*p.vx+ry*p.vy)/(d*v)>.9)return p}return null}
function teleTarget(u){const ab=u.ch.abil[u.cast.i],a=u.cast.aimOv??u.aim;if(!ab.tele)return null;if(ab.tele.self)return{x:u.x,y:u.y,r:ab.tele.r};const d=clamp(u.cast.td,40,ab.tele.max);return{x:u.x+Math.cos(a)*d,y:u.y+Math.sin(a)*d,r:ab.tele.r}}
function dangers(u){const L=[];for(const z of zones)if(z.owner.team!==u.team)L.push(z);for(const p of projs)if(p.grenade&&p.owner.team!==u.team)L.push({x:p.tx,y:p.ty,r:p.ar||80});
 for(const e of units)if(e.team!==u.team&&!e.dead&&Math.abs(e.x-u.x)<450){if(e.cast){const t=teleTarget(e);if(t)L.push(t)}if(e.spin)L.push({x:e.x,y:e.y,r:e.spin.r+10})}return L}
function pickTarget(u){let best=null,bd=mode==='arena'?1e9:800;for(const e of units){if(e.team===u.team||e.dead)continue;const d=dist(u,e)-(e===player?60:0);if(d<bd){bd=d;best=e}}return best}
function ai(u,dt){
 if((u.aiT-=dt)<=0)u.tgt=pickTarget(u);
 const e=u.tgt&&!u.tgt.dead?u.tgt:null;let mx=0,my=0;
 if(!e){const gx=u.team?MAP.x+200:MAP.w-200,a=Math.atan2(u.lane-u.y,gx-u.x);
  return[Math.cos(a)*.9,Math.sin(a)*.9+clamp((u.lane-u.y)/300,-.5,.5)]}
 const d=dist(u,e),a=ang(u,e),tt=d/800;
 u.aim=Math.atan2(e.y+e.vy*tt*.6-u.y,e.x+e.vx*tt*.6-u.x)+(rnd()-.5)*(u.hero?.15:.3);
 if((u.strT-=dt)<0){u.strT=.8+rnd()*1.5;u.strDir*=-1}
 const pref=u.ch.pref,rad=d>pref+40?1:d<pref-40?-1:0,sw=pref>200?.9:.5;
 mx=Math.cos(a)*rad+Math.cos(a+Math.PI/2)*u.strDir*sw;my=Math.sin(a)*rad+Math.sin(a+Math.PI/2)*u.strDir*sw;
 if(mode==='arena'){if(orb&&(dist(u,orb)<dist(e,orb)||u.hp<u.max*.5)){const oa=ang(u,orb);mx=Math.cos(oa);my=Math.sin(oa)}
  if(dist(u,{x:CX,y:CY})>sdR()-60){const ca=ang(u,{x:CX,y:CY});mx=Math.cos(ca);my=Math.sin(ca)}}
 else if(u.hp<u.max*.4){let pk=null,pd=500;for(const p of pickups)if(p.t<=0&&dist(u,p)<pd){pd=dist(u,p);pk=p}if(pk){const pa=ang(u,pk);mx=Math.cos(pa);my=Math.sin(pa)}}
 for(const z of dangers(u))if(Math.hypot(u.x-z.x,u.y-z.y)<z.r+28){const za=Math.atan2(u.y-z.y,u.x-z.x);mx=Math.cos(za);my=Math.sin(za)}
 if(u.aiT>0)return[mx,my];
 u.aiT=(u.hero?.13:.25)+rnd()*.17;
 const th=threat(u);
 // parade : les porteurs de sabre bloquent les tirs pour s'approcher des tireurs
 if(canBlock(u)&&u.stam>25){if(th&&rnd()<.7)u.aiBlock=.4+rnd()*.6;else if(e.ch.pref>200&&d>150&&d<650&&rnd()<.3)u.aiBlock=.5+rnd()*.8}
 if(u.aiBlock>0)return[mx,my];
 for(const i of[5,3,1,2,4]){const ab=u.ch.abil[i],h=ab&&ab.ai;if(!h||u.cds[i]>0||(ab.ult&&u.energy<100))continue;
  let ok=false,aimO,td=d;
  switch(h.mode||'atk'){
   case'atk':ok=d>=(h.min||0)&&d<=h.max;break;
   case'gap':ok=d>=h.min&&d<=h.max;td=d-30;break;
   case'esc':ok=d<h.max||(th&&rnd()<.5);aimO=th?Math.atan2(th.vy,th.vx)+Math.PI/2*(rnd()<.5?1:-1):a+Math.PI+(rnd()-.5);td=300;break;
   case'def':ok=!!th||(d<110&&(e.swing>0||e.spin))||(e.cast&&d<300);break;
   case'self':ok=d<=h.max;break;
   case'heal':ok=u.hp<u.max*.6;break}
  if(ok&&rnd()<(h.p??.5)*(u.hero?1:.5)&&use(u,i,td,aimO,u.energy>=50&&rnd()<.4))return[mx,my];
 }
 const l=u.ch.abil[0].ai;if(d<=l.max&&rnd()<l.p)use(u,0,d);
 return[mx,my];
}

// ---------- Mise à jour ----------
function collide(u){
 u.x=clamp(u.x,B.x+u.r,B.x+B.w-u.r);u.y=clamp(u.y,B.y+u.r,B.y+B.h-u.r);
 for(const p of OBST){const d=Math.hypot(u.x-p.x,u.y-p.y),m=p.r+u.r;if(d<m&&d>0){u.x=p.x+(u.x-p.x)/d*m;u.y=p.y+(u.y-p.y)/d*m}}
}
function respawn(u){const p=spawnPos(u.team),n=mkUnit(u.c,p.x,p.y,u.team);n.lane=u.lane;n.energy=u.hero?30:0;Object.assign(u,n);if(u===player)deathPos=null}
function updUnit(u,dt,active){
 for(let i=0;i<6;i++)u.cds[i]=Math.max(0,u.cds[i]-dt);
 for(const k of['stun','deflect','slow','haste','rage','rapid','unstop','swing','blockLock','aiBlock'])u[k]=Math.max(0,u[k]-dt);u.flash-=dt;
