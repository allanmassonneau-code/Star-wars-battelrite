<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arène Holonet</title>
<style>
/* Plein écran : une arène canvas 16:9 centrée, look unique sombre */
:root{--bg:#04050b;--fg:#dfe8ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;cursor:crosshair;background:var(--bg)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1280,H=720;
const A={x:90,y:70,w:1100,h:555},CX=A.x+A.w/2,CY=A.y+A.h/2;
const pillars=[{x:430,y:235,r:34},{x:850,y:235,r:34},{x:430,y:460,r:34},{x:850,y:460,r:34}];
const stars=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.2}));
const keys={},mouse={x:CX,y:CY,l:0};let pressed={};
const lbl={lmb:'Clic G',rmb:'Clic D',Space:'Espace',KeyQ:'Q',KeyE:'E',KeyR:'R',KeyW:'W',KeyA:'A',KeyS:'S',KeyD:'D'};
try{navigator.keyboard&&navigator.keyboard.getLayoutMap().then(m=>{for(const c of['KeyQ','KeyE','KeyR','KeyW','KeyA','KeyS','KeyD'])if(m.get(c))lbl[c]=m.get(c).toUpperCase()}).catch(()=>{})}catch(e){}
addEventListener('keydown',e=>{if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;mouse.l=0});
cv.addEventListener('mousemove',e=>{const b=cv.getBoundingClientRect();mouse.x=(e.clientX-b.left)*W/b.width;mouse.y=(e.clientY-b.top)*H/b.height});
cv.addEventListener('mousedown',e=>{if(e.button===0){mouse.l=1;pressed.lmb=1}if(e.button===2)pressed.rmb=1});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=0});
cv.addEventListener('contextmenu',e=>e.preventDefault());

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=Math.random;
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return Math.abs(d)};

// ---------- Champions ----------
const CH={
 jedi:{name:'Jedi',desc:'Mêlée, mobile, renvoie les attaques',hp:170,spd:215,pref:50,abil:[
  {k:'lmb',n:'Sabre',cd:.5,f:(u,a)=>melee(u,a,80,1.9,12)},
  {k:'rmb',n:'Lancer de sabre',cd:4,f:(u,a)=>{u.saberOut=9;proj(u,a,{spd:640,r:10,dmg:18,life:.8,col:saberCol(u),saber:1})}},
  {k:'Space',n:'Bond de Force',cd:6,f:(u,a,t)=>dash(u,a,clamp(t,60,270),.28,()=>aoe(u,u.x,u.y,65,8,{kb:300}))},
  {k:'KeyQ',n:'Poussée de Force',cd:7,f:(u,a)=>cone(u,a,175,1.7,10,{kb:700,slow:1.2})},
  {k:'KeyE',n:'Renvoi',cd:8,f:u=>{u.deflect=1}},
  {k:'KeyR',n:'Tempête de Force',ult:1,f:u=>aoe(u,u.x,u.y,175,32,{stun:1.1,kb:350})},
 ]},
 hunter:{name:'Chasseur de primes',desc:'Distance, explosifs, jetpack',hp:145,spd:225,pref:320,abil:[
  {k:'lmb',n:'Blaster',cd:.32,f:(u,a)=>proj(u,a,{spd:850,r:5,dmg:7,life:.75,col:'#ff4a3a'})},
  {k:'rmb',n:'Tir chargé',cd:4,f:(u,a)=>proj(u,a,{spd:1100,r:8,dmg:22,life:.7,col:'#ffb03a'})},
  {k:'Space',n:'Jetpack',cd:7,f:(u,a)=>dash(u,a,300,.3)},
  {k:'KeyQ',n:'Détonateur',cd:9,f:(u,a,t)=>proj(u,a,{spd:520,r:8,dmg:0,life:clamp(t,80,430)/520,col:'#7cf',grenade:1})},
  {k:'KeyE',n:'Bouclier',cd:10,f:u=>{u.shield=35;u.shieldT=3}},
  {k:'KeyR',n:'Roquette',ult:1,f:(u,a)=>proj(u,a,{spd:720,r:12,dmg:34,life:1.1,col:'#f60',rocket:1})},
 ]}};
const saberCol=u=>u.team?'#ff3030':'#40c0ff';
const uname=u=>u.c==='jedi'&&u.team?'Inquisiteur Sith':u.ch.name;

// ---------- État ----------
let state='menu',units=[],projs=[],fx=[],txt=[],orb=null,orbUsed=false,score=[0,0],round=1,timer=0,stateT=0,playerChamp='jedi',winner=0,shake=0;
function mkUnit(c,x,y,team){const ch=CH[c];return{c,ch,x,y,vx:0,vy:0,kx:0,ky:0,r:18,hp:ch.hp,max:ch.hp,energy:0,team,cds:[0,0,0,0,0,0],stun:0,slow:0,deflect:0,shield:0,shieldT:0,dash:null,aim:team?Math.PI:0,swing:0,swingA:0,saberOut:0,aiT:.5,strT:0,strDir:1,flash:0,dead:false}}
function startMatch(c){playerChamp=c;score=[0,0];round=1;startRound()}
function startRound(){const other=playerChamp==='jedi'?'hunter':'jedi';units=[mkUnit(playerChamp,A.x+150,CY,0),mkUnit(other,A.x+A.w-150,CY,1)];projs=[];fx=[];txt=[];orb=null;orbUsed=false;timer=0;state='countdown';stateT=3}
const foe=u=>units[1-u.team];

// ---------- Capacités ----------
function use(u,i,td,aimOv){const ab=u.ch.abil[i];if(u.cds[i]>0||u.stun>0||u.dash)return false;if(ab.ult&&u.energy<100)return false;if(i===1&&u.c==='jedi'&&u.saberOut>0)return false;
 u.cds[i]=ab.cd||1;if(ab.ult){u.energy-=100;shake=.3}const a=aimOv??u.aim;ab.f(u,a,td??200);return true}
function proj(u,a,o){projs.push(Object.assign({x:u.x+Math.cos(a)*24,y:u.y+Math.sin(a)*24,vx:Math.cos(a)*o.spd,vy:Math.sin(a)*o.spd,owner:u,src:u,rot:0},o))}
function melee(u,a,range,arc,dmg){u.swing=.18;u.swingA=a;const e=foe(u);
 if(!e.dead&&dist(u,e)<range+e.r&&angDiff(ang(u,e),a)<arc/2)hit(e,u,dmg,{melee:1});
 // le sabre renvoie aussi les tirs
 for(const p of projs)if(p.owner.team!==u.team&&Math.hypot(p.x-u.x,p.y-u.y)<range&&angDiff(Math.atan2(p.y-u.y,p.x-u.x),a)<arc/2&&rnd()<.5)reflect(p,u)}
function cone(u,a,range,arc,dmg,o){const e=foe(u);for(let i=0;i<24;i++){const b=a+(rnd()-.5)*arc,s=300+rnd()*300;fx.push({x:u.x,y:u.y,vx:Math.cos(b)*s,vy:Math.sin(b)*s,t:.4,m:.4,col:'#9df',r:3})}
 if(!e.dead&&dist(u,e)<range+e.r&&angDiff(ang(u,e),a)<arc/2)hit(e,u,dmg,Object.assign({melee:1},o))}
function aoe(u,x,y,r,dmg,o={}){const e=foe(u);ring(x,y,r,o.stun?'#b8f':'#fc6');if(!e.dead&&Math.hypot(e.x-x,e.y-y)<r+e.r)hit(e,u,dmg,Object.assign({fx:x,fy:y},o))}
function dash(u,a,d,dur,end){const tx=clamp(u.x+Math.cos(a)*d,A.x+u.r,A.x+A.w-u.r),ty=clamp(u.y+Math.sin(a)*d,A.y+u.r,A.y+A.h-u.r);u.dash={sx:u.x,sy:u.y,tx,ty,t:0,dur,end}}
function reflect(p,t){p.owner=t;p.vx*=-1.1;p.vy*=-1.1;p.life=Math.max(p.life,.7);say(t,'RENVOI !','#7df');sparks(p.x,p.y,'#7df',8)}
function hit(t,src,dmg,o={}){
 if(t.dead||state!=='fight')return;
 if(t.deflect>0&&o.melee){src.stun=Math.max(src.stun,.9);t.deflect=0;say(t,'RENVOI !','#7df');say(src,'ÉTOURDI','#b8f');sparks(t.x,t.y,'#7df',14);return}
 let d=dmg;if(t.shield>0){const ab=Math.min(t.shield,d);t.shield-=ab;d-=ab}
 t.hp-=d;t.flash=.12;src.energy=Math.min(100,src.energy+dmg*.7);t.energy=Math.min(100,t.energy+dmg*.25);
 if(dmg>0)say(t,'-'+Math.round(d),d<dmg?'#fc6':'#fff');
 if(o.stun){t.stun=Math.max(t.stun,o.stun);say(t,'ÉTOURDI','#b8f')}
 if(o.slow)t.slow=Math.max(t.slow,o.slow);
 if(o.kb){const fx0=o.fx??src.x,fy0=o.fy??src.y,a=Math.atan2(t.y-fy0,t.x-fx0);t.kx+=Math.cos(a)*o.kb;t.ky+=Math.sin(a)*o.kb;t.dash=null}
 sparks(t.x,t.y,t.team?'#f66':'#6cf',6);shake=Math.max(shake,.08);
 if(t.hp<=0){t.hp=0;t.dead=true;score[src.team]++;winner=src.team;state='roundEnd';stateT=2.8;sparks(t.x,t.y,'#fff',40);shake=.5}
}
function explode(p){p.boom=1;if(p.grenade)aoe(p.owner,p.x,p.y,80,10,{stun:1});else aoe(p.owner,p.x,p.y,95,p.dmg,{kb:550});sparks(p.x,p.y,p.col,24);shake=Math.max(shake,.2)}

// ---------- Effets ----------
function say(u,s,col){txt.push({x:u.x+(rnd()-.5)*20,y:u.y-30,s,col,t:1})}
function sparks(x,y,col,n){for(let i=0;i<n;i++){const a=rnd()*7,s=80+rnd()*260;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5,m:.5,col,r:2+rnd()*2})}}
function ring(x,y,r,col){fx.push({x,y,ring:r,t:.35,m:.35,col})}

// ---------- IA ----------
function threat(u){for(const p of projs){if(p.owner.team===u.team)continue;const rx=u.x-p.x,ry=u.y-p.y,d=Math.hypot(rx,ry),v=Math.hypot(p.vx,p.vy);if(d<200&&(rx*p.vx+ry*p.vy)/(d*v)>.9)return p}return null}
function ai(u,e,dt){
 const d=dist(u,e),a=ang(u,e),tt=d/800;
 u.aim=Math.atan2(e.y+e.vy*tt*.6-u.y,e.x+e.vx*tt*.6-u.x)+(rnd()-.5)*.15;
 if((u.strT-=dt)<0){u.strT=.8+rnd()*1.5;u.strDir*=-1}
 const pref=u.ch.pref,rad=d>pref+40?1:d<pref-40?-1:0;
 let mx=Math.cos(a)*rad+Math.cos(a+Math.PI/2)*u.strDir*(u.c==='hunter'?.9:.4),my=Math.sin(a)*rad+Math.sin(a+Math.PI/2)*u.strDir*(u.c==='hunter'?.9:.4);
 if(orb&&(dist(u,orb)<dist(e,orb)||u.hp<u.max*.5)){const oa=ang(u,orb);mx=Math.cos(oa);my=Math.sin(oa)}
 if((u.aiT-=dt)>0)return[mx,my];
 u.aiT=.13+rnd()*.17;
 const th=threat(u);
 if(th){if(u.c==='jedi'&&rnd()<.55&&use(u,4))return[mx,my];if(u.c==='hunter'&&rnd()<.5&&use(u,4))return[mx,my];
  if(rnd()<.35&&use(u,2,250,Math.atan2(th.vy,th.vx)+Math.PI/2*(rnd()<.5?1:-1)))return[mx,my]}
 if(u.c==='jedi'){
  if(e.c==='jedi'&&e.swing>0&&d<100&&rnd()<.4&&use(u,4))return[mx,my];
  if(u.energy>=100&&d<150&&use(u,5))return[mx,my];
  if(d<145&&rnd()<.6&&use(u,3))return[mx,my];
  if(d>190&&d<430&&rnd()<.5&&use(u,2,d-30))return[mx,my];
  if(d>130&&d<460&&rnd()<.35&&use(u,1))return[mx,my];
  if(d<90)use(u,0);
 }else{
  if(u.energy>=100&&d<600&&use(u,5))return[mx,my];
  if(d<150&&rnd()<.5&&use(u,2,300,a+Math.PI+(rnd()-.5)))return[mx,my];
  if(d<120&&u.hp<u.max*.7&&use(u,4))return[mx,my];
  if(d<400&&rnd()<.3&&use(u,3,d))return[mx,my];
  if(d<650&&rnd()<.3&&use(u,1))return[mx,my];
  if(d<620&&rnd()<.85)use(u,0);
 }
 return[mx,my];
}

// ---------- Mise à jour ----------
function collide(u){
 u.x=clamp(u.x,A.x+u.r,A.x+A.w-u.r);u.y=clamp(u.y,A.y+u.r,A.y+A.h-u.r);
 for(const p of pillars){const d=Math.hypot(u.x-p.x,u.y-p.y),m=p.r+u.r;if(d<m&&d>0){u.x=p.x+(u.x-p.x)/d*m;u.y=p.y+(u.y-p.y)/d*m}}
}
function updUnit(u,dt,active){
 for(let i=0;i<6;i++)u.cds[i]=Math.max(0,u.cds[i]-dt);
 u.stun=Math.max(0,u.stun-dt);u.deflect=Math.max(0,u.deflect-dt);u.slow=Math.max(0,u.slow-dt);u.swing=Math.max(0,u.swing-dt);u.flash-=dt;
 if(u.shieldT>0){u.shieldT-=dt;if(u.shieldT<=0)u.shield=0}
 if(u.dead)return;
 if(u.dash){const d=u.dash;d.t+=dt;const k=Math.min(1,d.t/d.dur);u.x=d.sx+(d.tx-d.sx)*k;u.y=d.sy+(d.ty-d.sy)*k;
  fx.push({x:u.x,y:u.y,vx:0,vy:0,t:.25,m:.25,col:u.c==='hunter'?'#f93':saberCol(u),r:8});
  if(k>=1){u.dash=null;d.end&&d.end()}collide(u);return}
 let mx=0,my=0;
 if(active&&u.stun<=0){
  if(u.team===0){
   const K=c=>keys[c]?1:0;
   mx=(K('KeyD')||K('ArrowRight'))-(K('KeyA')||K('ArrowLeft'));my=(K('KeyS')||K('ArrowDown'))-(K('KeyW')||K('ArrowUp'));
   u.aim=Math.atan2(mouse.y-u.y,mouse.x-u.x);const td=Math.hypot(mouse.x-u.x,mouse.y-u.y);
   if(mouse.l)use(u,0,td);if(pressed.rmb)use(u,1,td);if(pressed.Space)use(u,2,td);if(pressed.KeyQ)use(u,3,td);if(pressed.KeyE)use(u,4,td);if(pressed.KeyR)use(u,5,td);
  }else[mx,my]=ai(u,foe(u),dt);
 }
 const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 const sp=u.ch.spd*(u.slow>0?.55:1);u.vx=mx*sp;u.vy=my*sp;
 u.x+=(u.vx+u.kx)*dt;u.y+=(u.vy+u.ky)*dt;const dec=Math.exp(-7*dt);u.kx*=dec;u.ky*=dec;
 collide(u);
}
function update(dt){
 if(state==='menu'){
  if(pressed.Digit1)startMatch('jedi');if(pressed.Digit2)startMatch('hunter');
  if(pressed.lmb){if(inRect(mouse,cards[0]))startMatch('jedi');else if(inRect(mouse,cards[1]))startMatch('hunter')}
  return}
 if(state==='matchEnd'){if(pressed.lmb||pressed.Enter||pressed.Space)state='menu';return}
 stateT-=dt;shake=Math.max(0,shake-dt);
 if(state==='countdown'&&stateT<=0)state='fight';
 if(state==='roundEnd'&&stateT<=0){if(score[0]>=2||score[1]>=2)state='matchEnd';else{round++;startRound()}}
 const active=state==='fight';
 if(active)timer+=dt;
 if(active&&!orb&&!orbUsed&&timer>18){orb={x:CX,y:CY};ring(CX,CY,60,'#6f9')}
 for(const u of units)updUnit(u,dt,active);
 // séparation des unités
 const [a,b]=units,d=dist(a,b),m=a.r+b.r;if(d<m&&d>0){const px=(b.x-a.x)/d*(m-d)/2,py=(b.y-a.y)/d*(m-d)/2;a.x-=px;a.y-=py;b.x+=px;b.y+=py}
 if(orb&&active)for(const u of units)if(!u.dead&&dist(u,orb)<u.r+16){u.hp=Math.min(u.max,u.hp+30);u.energy=Math.min(100,u.energy+35);say(u,'+30 HOLOCRON','#6f9');sparks(orb.x,orb.y,'#6f9',30);orb=null;orbUsed=true;break}
 for(const p of projs){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*25;
  if(p.rocket)fx.push({x:p.x,y:p.y,vx:(rnd()-.5)*40,vy:(rnd()-.5)*40,t:.3,m:.3,col:'#fa3',r:4});
  let dead=p.life<=0||p.x<A.x||p.x>A.x+A.w||p.y<A.y||p.y>A.y+A.h;
  for(const pl of pillars)if(Math.hypot(p.x-pl.x,p.y-pl.y)<pl.r+p.r)dead=true;
  const t=units[1-p.owner.team];
  if(!dead&&!t.dead&&Math.hypot(t.x-p.x,t.y-p.y)<t.r+p.r){
   if(t.deflect>0)reflect(p,t);
   else{if(!(p.grenade||p.rocket))hit(t,p.owner,p.dmg);dead=true}
  }
  if(dead){p.dead=1;if((p.grenade||p.rocket)&&!p.boom)explode(p);else if(!p.boom)sparks(p.x,p.y,p.col,4);if(p.saber)p.src.saberOut=0}
 }
 projs=projs.filter(p=>!p.dead);
 for(const f of fx){f.t-=dt;if(!f.ring){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.92;f.vy*=.92}}fx=fx.filter(f=>f.t>0);
 for(const t of txt){t.t-=dt;t.y-=40*dt}txt=txt.filter(t=>t.t>0);
}

// ---------- Rendu ----------
const cards=[{x:330,y:250,w:290,h:300,c:'jedi'},{x:660,y:250,w:290,h:300,c:'hunter'}];
const inRect=(p,r)=>p.x>r.x&&p.x<r.x+r.w&&p.y>r.y&&p.y<r.y+r.h;
function text(s,x,y,size,col,align='center',weight='bold'){g.font=`${weight} ${size}px "Trebuchet MS",system-ui,sans-serif`;g.textAlign=align;g.fillStyle=col;g.fillText(s,x,y)}
function drawStars(){g.fillStyle='#04050b';g.fillRect(0,0,W,H);for(const s of stars){g.globalAlpha=.3+s.s*.35;g.fillStyle='#cfe0ff';g.fillRect(s.x,s.y,s.s,s.s)}g.globalAlpha=1}
function drawMenu(){
 g.save();g.shadowColor='#ffe81f';g.shadowBlur=20;text('STAR WARS',W/2,130,72,'#ffe81f');g.restore();
 text('ARÈNE — 1 contre 1, au meilleur des 3 manches',W/2,175,22,'#9fb3d9','center','normal');
 text('Choisis ton champion',W/2,225,20,'#dfe8ff');
 cards.forEach((c,i)=>{const h=inRect(mouse,c),ch=CH[c.c];
  g.fillStyle=h?'#16223a':'#0d1424';g.strokeStyle=h?'#ffe81f':'#2a3a5a';g.lineWidth=2;g.beginPath();g.roundRect(c.x,c.y,c.w,c.h,10);g.fill();g.stroke();
  const fake=mkUnit(c.c,c.x+c.w/2,c.y+60,0);fake.aim=-Math.PI/4;drawUnit(fake,true);
  text(`${i+1}. ${ch.name}`,c.x+c.w/2,c.y+125,22,'#fff');
  text(ch.desc,c.x+c.w/2,c.y+150,14,'#9fb3d9','center','normal');
  ch.abil.forEach((ab,j)=>{text(`${lbl[ab.k]} · ${ab.n}${ab.ult?' (énergie)':''}`,c.x+c.w/2,c.y+182+j*19,14,ab.ult?'#ffe81f':'#cbd6ee','center','normal')});
 });
 text(`Déplacement : ${lbl.KeyW}${lbl.KeyA}${lbl.KeyS}${lbl.KeyD} ou flèches · Viser : souris · Un holocron de soin apparaît au centre après 18 s`,W/2,600,15,'#7f93b8','center','normal');
}
function drawArena(){
 g.fillStyle='#111722';g.beginPath();g.roundRect(A.x,A.y,A.w,A.h,24);g.fill();
 g.save();g.clip();g.strokeStyle='rgba(120,160,220,.06)';g.lineWidth=1;
 for(let x=A.x;x<A.x+A.w;x+=40){g.beginPath();g.moveTo(x,A.y);g.lineTo(x,A.y+A.h);g.stroke()}
 for(let y=A.y;y<A.y+A.h;y+=40){g.beginPath();g.moveTo(A.x,y);g.lineTo(A.x+A.w,y);g.stroke()}
 g.strokeStyle='rgba(255,232,31,.12)';g.lineWidth=3;g.beginPath();g.arc(CX,CY,90,0,7);g.stroke();
 g.beginPath();g.moveTo(CX,A.y);g.lineTo(CX,A.y+A.h);g.stroke();g.restore();
 g.save();g.shadowColor='#3a7bd5';g.shadowBlur=18;g.strokeStyle='#2c4a78';g.lineWidth=4;g.beginPath();g.roundRect(A.x,A.y,A.w,A.h,24);g.stroke();g.restore();
 for(const p of pillars){g.fillStyle='rgba(0,0,0,.4)';g.beginPath();g.arc(p.x+5,p.y+8,p.r,0,7);g.fill();
  const gr=g.createRadialGradient(p.x-10,p.y-10,4,p.x,p.y,p.r);gr.addColorStop(0,'#55617a');gr.addColorStop(1,'#232a38');g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();
  g.strokeStyle='#ff9a3a';g.globalAlpha=.5;g.lineWidth=2;g.beginPath();g.arc(p.x,p.y,p.r-8,0,7);g.stroke();g.globalAlpha=1}
 if(orb){const t=performance.now()/300;g.save();g.shadowColor='#6f9';g.shadowBlur=25;g.translate(orb.x,orb.y);g.rotate(t*.5);g.fillStyle='#3d9';g.fillRect(-10,-10,20,20);g.strokeStyle='#bfc';g.lineWidth=2;g.strokeRect(-10-Math.sin(t)*2,-10-Math.sin(t)*2,20+Math.sin(t)*4,20+Math.sin(t)*4);g.restore()}
}
function drawUnit(u,preview){
 if(u.dead){g.globalAlpha=.35}
 const tc=u.team?'#ff4d4d':'#4db8ff';
 g.save();g.translate(u.x,u.y);
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,12,20,8,0,0,7);g.fill();
 g.strokeStyle=tc;g.lineWidth=3;g.globalAlpha*=.7;g.beginPath();g.arc(0,0,u.r+5,0,7);g.stroke();g.globalAlpha=u.dead?.35:1;
 const a=u.swing>0?u.swingA+(1-u.swing/.18-.5)*1.9:u.aim;
 if(u.c==='jedi'){
  if(u.saberOut<=0&&!u.dead){const col=saberCol(u),hx=Math.cos(a)*14,hy=Math.sin(a)*14,ex=Math.cos(a)*58,ey=Math.sin(a)*58;
   g.save();g.lineCap='round';g.shadowColor=col;g.shadowBlur=16;g.strokeStyle=col;g.lineWidth=7;g.beginPath();g.moveTo(hx,hy);g.lineTo(ex,ey);g.stroke();
   g.shadowBlur=0;g.strokeStyle='#fff';g.lineWidth=2.5;g.beginPath();g.moveTo(hx,hy);g.lineTo(ex,ey);g.stroke();g.restore()}
  g.fillStyle=u.flash>0?'#fff':(u.team?'#1d1d22':'#7a5a3a');g.beginPath();g.arc(0,0,u.r,0,7);g.fill();
  g.fillStyle=u.flash>0?'#fff':(u.team?'#0c0c0f':'#5a4028');g.beginPath();g.arc(-Math.cos(u.aim)*4,-Math.sin(u.aim)*4,u.r*.7,0,7);g.fill();
  g.fillStyle=u.team?'#ffcf9a':'#e8c39a';g.beginPath();g.arc(Math.cos(u.aim)*6,Math.sin(u.aim)*6,6,0,7);g.fill();
  if(u.team){g.fillStyle='#ff3030';g.fillRect(Math.cos(u.aim)*6-3,Math.sin(u.aim)*6-1,2,2);g.fillRect(Math.cos(u.aim)*6+1,Math.sin(u.aim)*6-1,2,2)}
 }else{
  g.save();g.rotate(u.aim);g.fillStyle='#2a2a2e';g.fillRect(8,-3,26,6);g.fillStyle='#555';g.fillRect(8,-5,8,10);g.restore();
  g.fillStyle=u.flash>0?'#fff':'#5d6a74';g.beginPath();g.arc(0,0,u.r,0,7);g.fill();
  g.fillStyle=u.flash>0?'#fff':'#a9b6c0';g.beginPath();g.arc(Math.cos(u.aim)*3,Math.sin(u.aim)*3,u.r*.68,0,7);g.fill();
  g.save();g.rotate(u.aim);g.fillStyle='#111';g.fillRect(4,-6,4,12);g.fillRect(4,-1.5,10,3);g.restore();
  g.fillStyle='#b5651d';g.fillRect(-Math.cos(u.aim)*14-4,-Math.sin(u.aim)*14-4,8,8);
 }
 if(u.deflect>0){g.strokeStyle='#7df';g.lineWidth=3;g.globalAlpha=.5+Math.sin(performance.now()/40)*.3;g.beginPath();g.arc(0,0,u.r+12,0,7);g.stroke();g.globalAlpha=1}
 if(u.shield>0){g.fillStyle='rgba(255,180,60,.22)';g.strokeStyle='#fb4';g.lineWidth=2;g.beginPath();g.arc(0,0,u.r+9,0,7);g.fill();g.stroke()}
 if(u.stun>0){const t=performance.now()/150;for(let i=0;i<3;i++)text('✦',Math.cos(t+i*2.1)*16,-u.r-6+Math.sin(t+i*2.1)*4,12,'#ffe81f')}
 g.restore();g.globalAlpha=1;
 if(preview||u.dead)return;
 const w=54,x=u.x-w/2,y=u.y-u.r-22;
 g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x-1,y-1,w+2,8);g.fillStyle=tc;g.fillRect(x,y,w*u.hp/u.max,6);
 if(u.shield>0){g.fillStyle='#fda';g.fillRect(x+w*u.hp/u.max,y,Math.min(w*u.shield/u.max,w),6)}
 g.fillStyle='#ffe81f';g.fillRect(x,y+7,w*u.energy/100,2);
}
function drawProj(p){g.save();g.translate(p.x,p.y);g.shadowColor=p.col;g.shadowBlur=14;
 if(p.saber){g.rotate(p.rot);g.lineCap='round';g.strokeStyle=p.col;g.lineWidth=6;g.beginPath();g.moveTo(-22,0);g.lineTo(22,0);g.stroke();g.strokeStyle='#fff';g.lineWidth=2;g.stroke()}
 else if(p.grenade){g.fillStyle=Math.sin(performance.now()/60)>0?'#fff':p.col;g.beginPath();g.arc(0,0,p.r,0,7);g.fill()}
 else if(p.rocket){g.rotate(Math.atan2(p.vy,p.vx));g.fillStyle='#ddd';g.fillRect(-12,-5,24,10);g.fillStyle=p.col;g.fillRect(-16,-4,5,8)}
 else{g.rotate(Math.atan2(p.vy,p.vx));g.lineCap='round';g.strokeStyle=p.col;g.lineWidth=p.r;g.beginPath();g.moveTo(-14,0);g.lineTo(8,0);g.stroke();g.strokeStyle='#fff';g.lineWidth=p.r/2.5;g.stroke()}
 g.restore()}
function bar(x,y,w,h,v,col,right){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,y,w,h);g.fillStyle=col;const vw=w*clamp(v,0,1);g.fillRect(right?x+w-vw:x,y,vw,h);g.strokeStyle='#2a3a5a';g.lineWidth=1;g.strokeRect(x,y,w,h)}
function drawHud(){
 const p=units[0],e=units[1];
 text(uname(p)+' (toi)',30,32,18,'#9fd4ff','left');bar(30,40,360,16,p.hp/p.max,'#4db8ff');bar(30,59,360,5,p.energy/100,'#ffe81f');
 text(uname(e),W-30,32,18,'#ffa0a0','right');bar(W-390,40,360,16,e.hp/e.max,'#ff4d4d',1);bar(W-390,59,360,5,e.energy/100,'#ffe81f',1);
 text(`${score[0]}  —  ${score[1]}`,W/2,40,30,'#ffe81f');text(`Manche ${round} · ${Math.floor(timer)} s`,W/2,60,13,'#9fb3d9','center','normal');
 const n=6,s=80,gap=8,x0=W/2-(n*s+(n-1)*gap)/2,y=H-82;
 p.ch.abil.forEach((ab,i)=>{const x=x0+i*(s+gap),ready=ab.ult?p.energy>=100:p.cds[i]<=0;
  g.fillStyle='#0d1320';g.fillRect(x,y,s,s);
  g.strokeStyle=ab.ult?(ready?'#ffe81f':'#5a5020'):ready?'#4a6a9a':'#22304a';g.lineWidth=2;g.strokeRect(x,y,s,s);
  text(lbl[ab.k],x+s/2,y+26,lbl[ab.k].length>2?13:20,ready?'#fff':'#667','center');
  if(!ab.ult&&p.cds[i]>0){const k=p.cds[i]/ab.cd;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,y+s*(1-k),s,s*k);text(p.cds[i].toFixed(1),x+s/2,y+44,13,'#ffe81f')}
  if(ab.ult&&!ready){g.fillStyle='rgba(255,232,31,.25)';g.fillRect(x,y+s*(1-p.energy/100),s,s*p.energy/100)}
  text(ab.n,x+s/2,y+s+13,10,'#9fb3d9','center','normal')});
}
function draw(){
 drawStars();
 if(state==='menu'){drawMenu();return}
 g.save();if(shake>0)g.translate((rnd()-.5)*shake*24,(rnd()-.5)*shake*24);
 drawArena();
 for(const f of fx){g.globalAlpha=f.t/f.m;if(f.ring){g.strokeStyle=f.col;g.lineWidth=4;g.beginPath();g.arc(f.x,f.y,f.ring*(1.1-f.t/f.m*.6),0,7);g.stroke()}else{g.fillStyle=f.col;g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill()}}g.globalAlpha=1;
 for(const u of units)drawUnit(u);
 for(const p of projs)drawProj(p);
 for(const t of txt){g.globalAlpha=Math.min(1,t.t*2);text(t.s,t.x,t.y,15,t.col)}g.globalAlpha=1;
 g.restore();
 drawHud();
 if(state==='countdown'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);text(`Manche ${round}`,W/2,H/2-60,28,'#9fb3d9');text(String(Math.ceil(stateT)),W/2,H/2+20,90,'#ffe81f')}
 if(state==='roundEnd'){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);text(winner===0?'Manche gagnée':'Manche perdue',W/2,H/2,54,winner===0?'#7fd4ff':'#ff7a7a')}
 if(state==='matchEnd'){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H);const win=score[0]>score[1];
  g.save();g.shadowColor='#ffe81f';g.shadowBlur=24;text(win?'VICTOIRE':'DÉFAITE',W/2,H/2-10,84,win?'#ffe81f':'#ff5a5a');g.restore();
  text(win?'La Force est avec toi.':'Le côté obscur l\'emporte…',W/2,H/2+40,22,'#dfe8ff','center','normal');
  text('Clic ou Entrée pour revenir au menu',W/2,H/2+90,16,'#9fb3d9','center','normal')}
}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();pressed={};requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
